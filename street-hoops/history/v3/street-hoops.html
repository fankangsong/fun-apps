<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>街头投篮 · Street Hoops</title>
  <style>
    /* SECTION: tokens */
    :root {
      --paper: #f6f1e7;
      --ink:   #161616;
      --coral: #ff6b6b;
      --teal:  #2ec4b6;
      --sun:   #ffd23f;
      --blue:  #3a86ff;
      --pink:  #ff8fab;
      --card:  #fffdf6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }

    /* SECTION: stage */
    .stage {
      position: fixed; inset: 0;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
               env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }
    #cv { display: block; width: 100%; height: 100%; touch-action: none; }

    /* SECTION: marquee */
    .marquee {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      background: var(--ink); color: var(--sun); overflow: hidden;
      font-size: 12px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
      padding: 9px 0; padding-top: calc(9px + env(safe-area-inset-top, 0));
      pointer-events: none;
    }
    .marquee .in { display: inline-block; white-space: nowrap; animation: mq 22s linear infinite; }
    @keyframes mq { to { transform: translateX(-50%); } }

    /* SECTION: hud */
    .hud { position: fixed; z-index: 30; pointer-events: none; }
    .sticker {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 14px;
      box-shadow: 5px 5px 0 var(--sc, var(--ink));
      padding: 8px 16px;
    }
    .hud-score {
      top: calc(52px + env(safe-area-inset-top, 0));
      left: calc(14px + env(safe-area-inset-left, 0));
      --sc: var(--coral);
      transform: rotate(-2deg);
      font-weight: 900; font-size: clamp(16px, 3vw, 22px); letter-spacing: .06em;
    }
    .hud-best { display: block; font-size: 11px; font-weight: 700; letter-spacing: .18em; color: #6d675c; }
    .hud-timer {
      top: calc(52px + env(safe-area-inset-top, 0));
      right: calc(14px + env(safe-area-inset-right, 0));
      --sc: var(--blue);
      transform: rotate(2deg);
      font-weight: 900; font-size: clamp(16px, 3vw, 22px); letter-spacing: .06em;
    }
    .hud-timer.low { --sc: var(--coral); color: var(--coral); }
    @media (max-width: 640px) { .hud-title { display: none; } }
    .hud-combo {
      top: calc(112px + env(safe-area-inset-top, 0));
      left: calc(14px + env(safe-area-inset-left, 0));
      background: var(--sun);
      border: 3px solid var(--ink); border-radius: 999px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 6px 16px;
      font-weight: 900; font-size: 14px; letter-spacing: .1em;
      transform: rotate(-3deg) scale(0);
      transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
    }
    .hud-combo.on { transform: rotate(-3deg) scale(1); }
    .hud-title {
      top: calc(48px + env(safe-area-inset-top, 0));
      left: 50%; transform: translateX(-50%) rotate(-1deg);
      background: var(--ink); color: var(--paper);
      font-size: 11px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
      padding: 7px 14px;
    }

    /* SECTION: overlay */
    .overlay {
      position: fixed; inset: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top, 0)) 24px calc(24px + env(safe-area-inset-bottom, 0));
      background: rgba(22, 22, 22, .34);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .overlay[hidden] { display: none; }
    .panel {
      max-width: 470px; width: 100%; text-align: center;
      background: var(--card);
      border: 4px solid var(--ink); border-radius: 22px;
      box-shadow: 10px 10px 0 var(--ink);
      padding: clamp(24px, 5vw, 36px) clamp(20px, 4vw, 32px);
      animation: popin .5s cubic-bezier(.3, 1.6, .5, 1) both;
    }
    @keyframes popin { from { opacity: 0; transform: translateY(26px) scale(.94); } }
    .panel .badge {
      display: inline-block; background: var(--ink); color: var(--paper);
      font-size: clamp(10px, 2.4vw, 12px); font-weight: 700;
      letter-spacing: .3em; text-transform: uppercase;
      padding: 7px 16px; transform: rotate(-2deg);
    }
    .panel h1 {
      margin-top: 18px;
      font-size: clamp(40px, 10vw, 76px); font-weight: 900; line-height: .95; letter-spacing: -.01em;
      color: var(--paper);
      text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 var(--coral);
    }
    .panel h1 .pop { color: var(--sun); text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 var(--blue); }
    .panel .desc {
      margin: 18px auto 6px; max-width: 34ch;
      font-size: clamp(13.5px, 2.6vw, 15.5px); line-height: 1.75; color: #3c3a33;
    }
    .btn {
      margin-top: 22px; min-height: 52px; min-width: 200px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--sun); color: var(--ink);
      border: 3px solid var(--ink); border-radius: 999px;
      box-shadow: 0 6px 0 var(--ink);
      font-family: inherit; font-size: clamp(16px, 3vw, 19px); font-weight: 900; letter-spacing: .14em;
      cursor: pointer; touch-action: manipulation;
      transition: transform .16s cubic-bezier(.3, 1.6, .5, 1), box-shadow .16s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
    .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .final {
      margin-top: 14px;
      font-size: clamp(56px, 14vw, 92px); font-weight: 900; line-height: 1;
      color: var(--blue); text-shadow: 4px 4px 0 var(--ink);
    }
    .final small { display: block; font-size: 12px; letter-spacing: .3em; color: #6d675c; text-shadow: none; margin-top: 6px; }
    .newbest {
      display: inline-block; margin-top: 10px;
      background: var(--coral); color: var(--card);
      border: 2px solid var(--ink); border-radius: 999px;
      font-size: 12px; font-weight: 900; letter-spacing: .2em;
      padding: 6px 14px; transform: rotate(-2deg);
    }
    .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
    .stat {
      background: var(--paper); border: 2px solid var(--ink); border-radius: 12px;
      padding: 8px 14px; min-width: 76px;
      font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #3c3a33;
    }
    .stat b { display: block; font-size: 20px; font-weight: 900; color: var(--ink); letter-spacing: 0; }

    /* SECTION: shapes */
    .sh {
      position: fixed; z-index: 32; cursor: pointer;
      touch-action: manipulation; will-change: transform;
      transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
    }
    @media (hover: hover) { .sh:hover { transform: scale(1.12); } }
    .sh:active { transform: scale(.94); }
    .sh svg { display: block; width: 100%; height: 100%; overflow: visible; }

    /* SECTION: corner */
    .corner {
      position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0)); z-index: 32;
      font-size: 10.5px; font-weight: 700; letter-spacing: .3em;
      text-transform: uppercase; color: #6d675c; pointer-events: none;
    }
    .corner-l { left: 18px; }
    .corner-r { right: 18px; }
    @media (max-width: 640px) { .corner-r { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      .marquee .in, .panel, .hud-combo, .sh, .btn { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <!-- SECTION: marquee -->
  <div class="marquee" aria-hidden="true"><div class="in" id="mq"></div></div>

  <!-- SECTION: stage -->
  <div class="stage">
    <canvas id="cv"></canvas>
  </div>

  <!-- SECTION: hud -->
  <div class="hud hud-score sticker"><span id="scoreV">0</span><span class="hud-best">最佳 <b id="bestV">0</b></span></div>
  <div class="hud hud-timer sticker" id="timerBox"><span id="timerV">45</span> s</div>
  <div class="hud hud-combo" id="comboV">🔥 连击 ×1</div>
  <div class="hud hud-title">street hoops · 街头投篮</div>

  <!-- SECTION: shapes -->
  <div id="shapes"></div>

  <!-- SECTION: corners -->
  <div class="corner corner-l" aria-hidden="true">fun apps society · est. 2026</div>
  <div class="corner corner-r" aria-hidden="true">memphis vibes · 拖拽即投 · nº 06</div>

  <!-- SECTION: overlay-start -->
  <div class="overlay" id="ovStart">
    <div class="panel">
      <span class="badge">street hoops · nº 06</span>
      <h1>街头<br><span class="pop">投篮</span></h1>
      <p class="desc">按住篮球停顿片刻，可把它拖拽摆到场内任意位置（含空中）；直接快速拖拽则蓄力投篮。未碰筐板的空心球 +3，擦筐命中 +2；连续进球有连击加成，45 秒内尽情出手！</p>
      <button class="btn" id="btnStart" data-primary-action>开始游戏</button>
    </div>
  </div>

  <!-- SECTION: overlay-end -->
  <div class="overlay" id="ovEnd" hidden>
    <div class="panel">
      <span class="badge">time's up · 时间到</span>
      <div class="final"><span id="finalV">0</span><small>final score · 本局得分</small></div>
      <div id="newbest" class="newbest" hidden>新纪录 · new best!</div>
      <div class="stats">
        <span class="stat"><b id="statMakes">0</b>命中</span>
        <span class="stat"><b id="statAtt">0</b>出手</span>
        <span class="stat"><b id="statSwish">0</b>空心</span>
        <span class="stat"><b id="statStreak">0</b>最高连击</span>
      </div>
      <button class="btn" id="btnAgain" data-primary-action>再来一局</button>
    </div>
  </div>

  <script>
    /* SECTION: marquee-init */
    document.getElementById('mq').textContent = 'STREET HOOPS · 街头投篮 · 拖拽蓄力 · 空心 +3 · 连击加成 · 无规则 · 只管好玩 · '.repeat(18);
  </script>

  <script>
    /* SECTION: shapes-init */
    (function () {
      'use strict';
      var COLS = ['#ff6b6b', '#2ec4b6', '#ffd23f', '#3a86ff', '#ff8fab'];
      var DEFS = [
        function (c) { return { w: 120, h: 48, html: '<svg viewBox="0 0 150 60"><path d="M6 40 Q 22 8, 40 34 T 76 32 T 112 30 T 146 26" fill="none" stroke="' + c + '" stroke-width="11" stroke-linecap="round"/></svg>' }; },
        function (c) { return { w: 72, h: 66, html: '<svg viewBox="0 0 90 82"><polygon points="45,4 88,78 2,78" fill="' + c + '"/></svg>' }; },
        function (c) { return { w: 76, h: 76, html: '<svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="' + c + '"/><circle cx="48" cy="48" r="24" fill="none" stroke="#f6f1e7" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/></svg>' }; },
        function (c) { return { w: 96, h: 50, html: '<svg viewBox="0 0 120 62"><path d="M2 60 A 58 58 0 0 1 118 60 Z" fill="' + c + '"/></svg>' }; },
        function (c) { return { w: 128, h: 36, html: '<svg viewBox="0 0 160 44"><polyline points="6,34 30,8 54,34 78,8 102,34 126,8 150,34" fill="none" stroke="' + c + '" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>' }; }
      ];
      var SPOTS = [[2, 36, -6], [88, 44, 5]];
      var host = document.getElementById('shapes');
      SPOTS.forEach(function (sp, i) {
        var di = i % DEFS.length, ci = i % 5;
        var d = DEFS[di](COLS[ci]);
        var el = document.createElement('div');
        el.className = 'sh';
        el.style.left = 'min(' + sp[0] + '%, 100% - ' + (d.w + 12) + 'px)';
        el.style.top = 'calc(' + sp[1] + '% + 40px)';
        el.style.width = d.w + 'px';
        el.style.height = d.h + 'px';
        el.style.rotate = sp[2] + 'deg';
        el.dataset.rot = sp[2]; el.dataset.ci = ci; el.dataset.di = di;
        el.setAttribute('aria-hidden', 'true');
        el.innerHTML = d.html;
        el.addEventListener('click', function () {
          var c2 = (+el.dataset.ci + 1) % 5;
          el.dataset.ci = c2;
          var r = (+el.dataset.rot) + 22;
          el.dataset.rot = r;
          el.innerHTML = DEFS[+el.dataset.di](COLS[c2]).html;
          el.style.rotate = r + 'deg';
          el.style.transform = 'scale(1.15)';
          setTimeout(function () { el.style.transform = ''; }, 240);
        });
        host.appendChild(el);
      });
    })();
  </script>

  <script>
    /* SECTION: game */
    (function () {
      'use strict';

      /* SECTION: consts */
      var INK = '#161616', PAPER = '#f6f1e7', CARD = '#fffdf6';
      var CORAL = '#ff6b6b', TEAL = '#2ec4b6', SUN = '#ffd23f', BLUE = '#3a86ff', PINK = '#ff8fab';
      var GRAVITY = 2000;          // px/s^2
      var LAUNCH_K = 7.0;          // 拖拽像素 -> 初速度系数
      var MAX_SPEED = 1900;        // 最大出手速度
      var DRAG_MIN = 16;           // 低于此拖拽距离不出手
      var PICKUP_MOVE = 14;        // 按球后移动超过此值 -> 判定为蓄力发射
      var PICKUP_HOLD = 0.22;      // 按球静止超过此时长 -> 判定为拾取摆放
      var REST = 0.72;             // 弹性系数
      var GROUND_REST = 0.5;
      var ROUND_TIME = 45;         // 每局秒数
      var BEST_KEY = 'streetHoopsBest_v1';
      var FONT = '"Avenir Next","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';

      /* SECTION: dom */
      var cv = document.getElementById('cv');
      var ctx = cv.getContext('2d');
      var scoreV = document.getElementById('scoreV');
      var bestV = document.getElementById('bestV');
      var timerV = document.getElementById('timerV');
      var timerBox = document.getElementById('timerBox');
      var comboV = document.getElementById('comboV');
      var ovStart = document.getElementById('ovStart');
      var ovEnd = document.getElementById('ovEnd');
      var btnStart = document.getElementById('btnStart');
      var btnAgain = document.getElementById('btnAgain');
      var finalV = document.getElementById('finalV');
      var newbestEl = document.getElementById('newbest');
      var statMakes = document.getElementById('statMakes');
      var statAtt = document.getElementById('statAtt');
      var statSwish = document.getElementById('statSwish');
      var statStreak = document.getElementById('statStreak');

      /* SECTION: state */
      var W = 0, H = 0, dpr = 1;
      var mode = 'ready';          // ready | play | over
      var score = 0, best = 0, bestBeaten = false, timer = ROUND_TIME, lastTimerInt = -1;
      var streak = 0;
      var stats = { makes: 0, att: 0, swish: 0, bestStreak: 0 };
      var ballR = 17, rimW = 74;
      var ball = { x: 0, y: 0, vx: 0, vy: 0, spin: 0 };
      var ballResting = true;
      var shot = null;             // { active, scored, swishable, touched, t }
      var hoop = { x: 0, y: 0, sway: 0, flash: 0 };
      var dragId = null, drag = null, shakeT = 0;
      var parts = [], popups = [];
      var lastRimSfx = 0, tNow = 0;

      function groundY() { return H - Math.max(40, H * 0.07); }
      function ballRestY() { return groundY() - ballR - 2; }
      function rimTips() { return { x1: hoop.x - rimW, x2: hoop.x }; }
      function boardX() { return hoop.x + rimW * 0.2; }
      function boardTop() { return hoop.y - rimW * 1.06; }
      function boardBot() { return hoop.y + rimW * 0.5; }
      function boardR() { return Math.max(3.5, rimW * 0.055); }
      function rimR() { return Math.max(4.5, rimW * 0.07); }
      function streakMult() { return streak >= 6 ? 3 : (streak >= 3 ? 2 : 1); }

      /* SECTION: storage */
      try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }
      bestV.textContent = best;

      /* SECTION: audio */
      var actx = null, sfxT = 0;
      function unlockAudio() {
        try {
          if (!actx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) actx = new AC();
          }
          if (actx && actx.state === 'suspended') actx.resume();
        } catch (e) {}
      }
      function tone(freq, dur, type, vol, delay) {
        if (!actx) return;
        try {
          var now = actx.currentTime;
          var t0 = now + Math.max(sfxT, 0) + (delay || 0);
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = type || 'triangle';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(g); g.connect(actx.destination);
          o.start(t0); o.stop(t0 + dur + 0.05);
          sfxT = (t0 + dur * 0.5) - now;
        } catch (e) {}
      }
      function sfx(name) {
        if (!actx) return;
        if (name === 'swish') { tone(880, 0.1, 'sine', 0.14, 0); tone(1318, 0.14, 'sine', 0.12, 0.08); }
        else if (name === 'make') { tone(587, 0.09, 'triangle', 0.13, 0); tone(784, 0.13, 'triangle', 0.12, 0.07); }
        else if (name === 'rim') {
          if (tNow - lastRimSfx < 0.07) return;
          lastRimSfx = tNow;
          tone(235, 0.05, 'square', 0.05);
        }
        else if (name === 'miss') tone(165, 0.18, 'sawtooth', 0.06);
        else if (name === 'launch') tone(330, 0.05, 'triangle', 0.06);
        else if (name === 'buzzer') tone(110, 0.6, 'square', 0.14);
      }

      /* SECTION: layout */
      function initCanvas() {
        dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        var r = cv.getBoundingClientRect();
        W = Math.max(1, Math.round(r.width));
        H = Math.max(1, Math.round(r.height));
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ballR = Math.max(12, Math.min(19, W * 0.026));
        rimW = Math.max(58, Math.min(86, W * 0.1));
      }
      function moveHoop() {
        var margin = Math.max(160, W * 0.12);
        var minX = Math.min(Math.max(W * 0.5, ball.x + rimW + margin), W * 0.86);
        var maxX = W * 0.86;
        hoop.x = minX + Math.random() * Math.max(0, maxX - minX);
        var minY = Math.max(120 + rimW, H * 0.4);
        var maxY = Math.max(minY + 1, H * 0.58);
        hoop.y = minY + Math.random() * (maxY - minY);
        var edge = boardX() + rimW * 0.5 + 10;
        if (edge > W) hoop.x -= (edge - W);
        hoop.sway = 1.1;
      }
      function spawnBall() {
        var off = Math.max(140, Math.min(420, W * 0.18));
        ball.x = hoop.x - rimW - off;
        if (ball.x < ballR + 10) ball.x = ballR + 10;
        ball.y = ballRestY();
        ball.vx = 0; ball.vy = 0; ball.spin = 0;
        ballResting = true; shot = null;
      }
      function grabRadius() { return Math.max(ballR * 2.2, 26); }
      /* 任意位置摆放：场内 + 地面以上钳制，并从篮圈端点/篮板/立杆推出 */
      function resolvePlacement(px, py) {
        var x = Math.min(Math.max(px, ballR + 6), W - ballR - 6);
        var y = Math.min(Math.max(py, 64 + ballR), ballRestY());
        var t = rimTips(), i, tx, dx, dy, rr, d2, d;
        for (i = 0; i < 2; i++) {
          tx = i === 0 ? t.x1 : t.x2;
          dx = x - tx; dy = y - hoop.y;
          rr = ballR + rimR() + 2; d2 = dx * dx + dy * dy;
          if (d2 < rr * rr) {
            d = Math.sqrt(d2) || 1;
            x = tx + dx / d * rr;
            y = hoop.y + dy / d * rr;
          }
        }
        var bw = rimW * 0.55, bx = boardX();
        var bL = bx - bw * 0.35 - ballR, bR = bx + bw * 0.35 + ballR;
        if (y > boardTop() - ballR && y < boardBot() + ballR && x > bL && x < bR) {
          x = (x < bx) ? bL : bR;
        }
        var pL = bx - boardR() - ballR, pR = bx + boardR() + ballR;
        if (y > boardTop() + ballR && x > pL && x < pR) {
          x = (x < bx) ? pL : pR;
        }
        x = Math.min(Math.max(x, ballR + 6), W - ballR - 6);
        y = Math.min(Math.max(y, 64 + ballR), ballRestY());
        return { x: x, y: y };
      }

      /* SECTION: game-flow */
      function startGame() {
        unlockAudio();
        score = 0; timer = ROUND_TIME; streak = 0; bestBeaten = false; lastTimerInt = -1;
        stats = { makes: 0, att: 0, swish: 0, bestStreak: 0 };
        parts.length = 0; popups.length = 0; shakeT = 0;
        mode = 'play';
        moveHoop(); hoop.sway = 0;
        spawnBall();
        syncScore(); syncTimer(); syncCombo();
        ovStart.hidden = true; ovEnd.hidden = true;
      }
      function endGame() {
        mode = 'over'; shot = null; drag = null; dragId = null;
        sfx('buzzer');
        for (var i = 0; i < 36; i++) confetti(W * (0.3 + Math.random() * 0.4), H * 0.3);
        finalV.textContent = score;
        newbestEl.hidden = !bestBeaten;
        statMakes.textContent = stats.makes;
        statAtt.textContent = stats.att;
        statSwish.textContent = stats.swish;
        statStreak.textContent = stats.bestStreak;
        ovEnd.hidden = false;
        btnAgain.focus();
      }
      function syncScore() {
        scoreV.textContent = score;
        bestV.textContent = best;
      }
      function syncTimer() {
        var s = Math.max(0, Math.ceil(timer));
        if (s !== lastTimerInt) {
          lastTimerInt = s;
          timerV.textContent = s;
          if (s <= 10) timerBox.classList.add('low'); else timerBox.classList.remove('low');
        }
      }
      function syncCombo() {
        if (streak >= 2) {
          comboV.textContent = '🔥 连击 ×' + streakMult() + ' · ' + streak;
          comboV.classList.add('on');
        } else {
          comboV.classList.remove('on');
        }
      }
      function popup(txt, x, y, color) {
        popups.push({ txt: txt, x: x, y: y, t: 0, c: color || SUN });
      }
      function confetti(x, y) {
        var cols = [CORAL, TEAL, SUN, BLUE, PINK];
        parts.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 520,
          vy: -Math.random() * 430 - 60,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12,
          s: 5 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0],
          t: 0, life: 0.8 + Math.random() * 0.6
        });
      }

      /* SECTION: scoring */
      function onMade(swish) {
        if (shot) { shot.scored = true; shot.timer = 0.85; }
        stats.makes++; if (swish) stats.swish++;
        streak++;
        if (streak > stats.bestStreak) stats.bestStreak = streak;
        var mult = streakMult();
        var pts = (swish ? 3 : 2) * mult;
        score += pts;
        if (score > best) {
          best = score; bestBeaten = true;
          try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
        }
        popup(swish ? '+' + pts + ' 空心!' : '+' + pts, hoop.x - rimW * 0.5, hoop.y - rimW * 0.9, swish ? TEAL : SUN);
        for (var i = 0; i < (swish ? 26 : 16); i++) confetti(hoop.x - rimW * 0.5, hoop.y);
        hoop.sway = 1; hoop.flash = 1; shakeT = 0.16;
        sfx(swish ? 'swish' : 'make');
        syncScore(); syncCombo();
      }
      function onMissed() {
        if (shot) { shot.missed = true; shot.timer = 1.4; }
        if (streak >= 3) popup('连击中断', ball.x, ball.y - 40, PINK);
        streak = 0; syncCombo();
        sfx('miss');
      }

      /* SECTION: physics */
      function physics(dt) {
        if (!shot || !shot.active || ballResting) return;
        ball.vy += GRAVITY * dt;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        shot.t += dt;
        var prevY = ball.y - ball.vy * dt;
        var gy = groundY();

        /* 得分判定：向下穿过篮圈平面且位于圈内 */
        var t = rimTips();
        if (!shot.scored && !shot.missed && ball.vy > 0 && prevY < hoop.y && ball.y >= hoop.y &&
            ball.x > t.x1 + ballR * 0.35 && ball.x < t.x2 - ballR * 0.35) {
          onMade(shot.swishable);
        }

        /* 篮圈两端碰撞 */
        var tips = [t.x1, t.x2];
        for (var i = 0; i < 2; i++) {
          var tx = tips[i], dx = ball.x - tx, dy = ball.y - hoop.y;
          var rr = ballR + rimR(), d2 = dx * dx + dy * dy;
          if (d2 < rr * rr) {
            var d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d;
            ball.x = tx + nx * (rr + 0.3);
            ball.y = hoop.y + ny * (rr + 0.3);
            var vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
              ball.vx -= (1 + REST) * vn * nx;
              ball.vy -= (1 + REST) * vn * ny;
            }
            shot.swishable = false; shot.touched = true;
            hoop.sway = Math.max(hoop.sway, 0.6);
            sfx('rim');
          }
        }

        /* 篮板碰撞 */
        var bx = boardX(), br = boardR();
        if (ball.vx > 0 && ball.x + ballR > bx - br && ball.x < bx + br * 2 + ballR &&
            ball.y > boardTop() - ballR * 0.4 && ball.y < boardBot() + ballR * 0.4) {
          ball.x = bx - br - ballR;
          ball.vx = -Math.abs(ball.vx) * REST;
          ball.vy *= 0.985;
          shot.swishable = false; shot.touched = true;
          sfx('rim');
        }

        /* 地面 */
        if (ball.y + ballR >= gy) {
          ball.y = gy - ballR;
          if (ball.vy > 60) {
            ball.vy = -ball.vy * GROUND_REST;
            ball.vx *= 0.82;
            if (shot && shot.active && !shot.scored && !shot.missed) onMissed();
          } else {
            ball.vy = 0; ball.vx *= 0.9;
            if (Math.abs(ball.vx) < 22) {
              if (shot && shot.active && !shot.scored && !shot.missed) onMissed();
              ballResting = true;
            }
          }
        }

        /* 出界兜底 */
        if (shot && shot.active && !shot.missed &&
            (ball.x < -ballR * 3 || ball.x > W + ballR * 3 || ball.y > H + ballR * 3)) {
          onMissed();
        }
        /* 卡住超时兜底 */
        if (shot && shot.active && !shot.scored && !shot.missed && shot.t > 7) onMissed();

        ball.spin += (ball.vx / Math.max(ballR, 1)) * dt * 0.5;
      }

      /* SECTION: update */
      function update(dt) {
        if (mode === 'play') {
          timer -= dt;
          syncTimer();
          if (timer <= 0) { timer = 0; endGame(); }
        }
        if (mode === 'play') physics(dt);
        /* 按在球上的意图判定：快速拖动 = 蓄力发射；停顿 = 拾取摆放 */
        if (drag && drag.grab === 'pending' && mode === 'play' && ballResting) {
          var mdx = drag.x1 - drag.x0, mdy = drag.y1 - drag.y0;
          if (Math.sqrt(mdx * mdx + mdy * mdy) >= PICKUP_MOVE) {
            drag.grab = false;               // 转发射：锚点改到球心
            drag.x0 = ball.x; drag.y0 = ball.y;
            if (shot) { shot.timer = 0; shot = null; }
          } else {
            drag.hold += dt;
            if (drag.hold >= PICKUP_HOLD) {
              drag.grab = true;              // 转拾取：记录抓取偏移
              drag.offX = ball.x - drag.x1;
              drag.offY = ball.y - drag.y1;
              if (shot) { shot.timer = 0; shot = null; }
            }
          }
        }
        if (mode === 'play' && shot && shot.timer > 0 && !drag) {
          shot.timer -= dt;
          if (shot.timer <= 0) spawnBall();
        }
        shakeT = Math.max(0, shakeT - dt);
        hoop.sway = Math.max(0, hoop.sway - dt * 1.5);
        hoop.flash = Math.max(0, hoop.flash - dt * 2.2);
        var i;
        for (i = parts.length - 1; i >= 0; i--) {
          var p = parts[i];
          p.t += dt;
          if (p.t > p.life) { parts.splice(i, 1); continue; }
          p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        }
        for (i = popups.length - 1; i >= 0; i--) {
          popups[i].t += dt;
          if (popups[i].t > 1) popups.splice(i, 1);
        }
      }

      /* SECTION: render-scene */
      function drawBG() {
        ctx.fillStyle = PAPER;
        ctx.fillRect(-20, -20, W + 40, H + 40);
        ctx.fillStyle = 'rgba(22,22,22,0.06)';
        var x, y;
        for (y = 18; y < H; y += 34) {
          for (x = ((y / 34) % 2 === 0 ? 0 : 17); x < W; x += 34) {
            ctx.fillRect(x, y, 2, 2);
          }
        }
      }
      function drawSun() {
        var cx = W * 0.5, cy = H * 0.13, r = Math.min(W, H) * 0.05 + 8;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.sin(tNow * 0.4) * 0.06);
        ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (var i = 0; i < 8; i++) {
          var a = i * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (r + 6), Math.sin(a) * (r + 6));
          ctx.lineTo(Math.cos(a) * (r + 15), Math.sin(a) * (r + 15));
          ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832);
        ctx.fillStyle = SUN; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(-r * 0.15, -r * 0.15, r * 0.45, 0, 6.2832);
        ctx.fillStyle = 'rgba(255,253,246,0.55)'; ctx.fill();
        ctx.restore();
      }
      function drawCloud() {
        var cx = W * 0.14, cy = H * 0.16, r = Math.min(W, H) * 0.026 + 6;
        ctx.save();
        ctx.translate(cx + Math.sin(tNow * 0.5) * 6, cy);
        ctx.fillStyle = CARD; ctx.strokeStyle = INK; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-r * 1.4, 4, r * 0.9, 0, 6.2832);
        ctx.arc(0, -2, r * 1.15, 0, 6.2832);
        ctx.arc(r * 1.5, 5, r * 0.85, 0, 6.2832);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      function drawSkyline() {
        var gy = groundY();
        var defs = [
          { x: W * 0.02, w: W * 0.13, h: H * 0.24, c: TEAL },
          { x: W * 0.17, w: W * 0.09, h: H * 0.31, c: PINK },
          { x: W * 0.60, w: W * 0.11, h: H * 0.2, c: BLUE },
          { x: W * 0.74, w: W * 0.14, h: H * 0.28, c: CORAL },
          { x: W * 0.90, w: W * 0.09, h: H * 0.17, c: TEAL }
        ];
        for (var i = 0; i < defs.length; i++) {
          var b = defs[i], top = gy - b.h;
          ctx.fillStyle = b.c; ctx.strokeStyle = INK; ctx.lineWidth = 3;
          ctx.fillRect(b.x, top, b.w, b.h);
          ctx.strokeRect(b.x, top, b.w, b.h);
          ctx.fillStyle = PAPER;
          var cols = Math.max(2, Math.floor(b.w / 26)), rows = Math.max(2, Math.floor(b.h / 34));
          var ww = b.w / (cols * 2 + 1), wh = Math.min(12, b.h / (rows * 2.4));
          for (var cxi = 0; cxi < cols; cxi++) {
            for (var ryi = 0; ryi < rows; ryi++) {
              ctx.fillRect(b.x + ww * (cxi * 2 + 1), top + wh + ryi * (b.h / rows), ww, wh);
            }
          }
        }
        /* 涂鸦波浪 */
        var b2 = defs[3];
        ctx.save();
        ctx.strokeStyle = SUN; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        var gy0 = gy - b2.h * 0.4;
        ctx.moveTo(b2.x + 8, gy0);
        ctx.quadraticCurveTo(b2.x + b2.w * 0.3, gy0 - 14, b2.x + b2.w * 0.5, gy0);
        ctx.quadraticCurveTo(b2.x + b2.w * 0.7, gy0 + 14, b2.x + b2.w - 8, gy0);
        ctx.stroke();
        ctx.restore();
      }
      function drawGround() {
        var gy = groundY();
        ctx.fillStyle = INK;
        ctx.fillRect(-20, gy, W + 40, H - gy + 20);
        ctx.strokeStyle = PAPER; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-20, gy + 5); ctx.lineTo(W + 20, gy + 5);
        ctx.stroke();
        ctx.lineWidth = 2;
        for (var x = 12; x < W; x += 46) {
          ctx.beginPath();
          ctx.moveTo(x, gy + 14); ctx.lineTo(x + 14, gy + 14);
          ctx.stroke();
        }
      }

      /* SECTION: render-hoop */
      function drawPoleBoard() {
        var gy = groundY(), bx = boardX(), br = boardR(), bt = boardTop(), bb = boardBot();
        /* 立杆（先画，压在篮板后面） */
        ctx.fillStyle = INK;
        ctx.fillRect(bx - br, bt + 6, br * 2, gy - bt - 6);
        ctx.fillRect(bx - br * 3.2, gy - 6, br * 6.4, 6);
        /* 篮板 */
        var bh = bb - bt, bw = rimW * 0.55;
        ctx.fillStyle = CARD; ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
        ctx.fillRect(bx - bw * 0.35, bt, bw, bh);
        ctx.strokeRect(bx - bw * 0.35, bt, bw, bh);
        ctx.fillStyle = SUN; ctx.fillRect(bx - bw * 0.35 + 5, bt + bh * 0.3, bw - 10, bh * 0.34);
        ctx.strokeRect(bx - bw * 0.35 + 5, bt + bh * 0.3, bw - 10, bh * 0.34);
        ctx.fillStyle = CORAL;
        ctx.beginPath(); ctx.arc(bx - bw * 0.35 + bw * 0.5, bt + bh * 0.14, 6, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      }
      function drawBall() {
        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.spin);
        ctx.beginPath(); ctx.arc(0, 0, ballR, 0, 6.2832);
        ctx.fillStyle = SUN; ctx.fill();
        ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-ballR, 0); ctx.lineTo(ballR, 0); ctx.stroke();
        ctx.beginPath();
        ctx.arc(-ballR * 1.28, 0, ballR * 1.45, -0.62, 0.62);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(ballR * 1.28, 0, ballR * 1.45, Math.PI - 0.62, Math.PI + 0.62);
        ctx.stroke();
        ctx.restore();
      }
      function drawNet() {
        var t = rimTips();
        var L = rimW * 0.8, segs = 4, strands = 5;
        var sway = Math.sin(tNow * 7) * hoop.sway * rimW * 0.22;
        ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        for (var i = 0; i < strands; i++) {
          var f = i / (strands - 1);
          var sx = t.x1 + (t.x2 - t.x1) * f;
          var ex = (t.x1 + t.x2) / 2 + (f - 0.5) * rimW * 0.5 + sway;
          var ey = hoop.y + L;
          ctx.beginPath(); ctx.moveTo(sx, hoop.y + 3);
          for (var s = 1; s <= segs; s++) {
            var u = s / segs;
            var px = sx + (ex - sx) * Math.pow(u, 1.15);
            var py = hoop.y + 3 + (ey - hoop.y - 3) * u;
            ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        for (var s2 = 1; s2 <= segs - 1; s2++) {
          var u2 = s2 / segs;
          ctx.beginPath();
          for (var i2 = 0; i2 < strands; i2++) {
            var f2 = i2 / (strands - 1);
            var sx2 = t.x1 + (t.x2 - t.x1) * f2;
            var ex2 = (t.x1 + t.x2) / 2 + (f2 - 0.5) * rimW * 0.5 + sway;
            var px2 = sx2 + (ex2 - sx2) * Math.pow(u2, 1.15);
            var py2 = hoop.y + 3 + (hoop.y + L - hoop.y - 3) * u2;
            if (i2 === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
          }
          ctx.stroke();
        }
      }
      function drawRim() {
        var t = rimTips();
        ctx.lineCap = 'round';
        ctx.strokeStyle = INK; ctx.lineWidth = rimR() * 2 + 5;
        ctx.beginPath(); ctx.moveTo(t.x1, hoop.y); ctx.lineTo(t.x2, hoop.y); ctx.stroke();
        ctx.strokeStyle = CORAL; ctx.lineWidth = rimR() * 2;
        ctx.beginPath(); ctx.moveTo(t.x1, hoop.y); ctx.lineTo(t.x2, hoop.y); ctx.stroke();
        if (hoop.flash > 0) {
          ctx.strokeStyle = 'rgba(255,210,63,' + hoop.flash.toFixed(3) + ')';
          ctx.lineWidth = rimR() * 2 + 10;
          ctx.beginPath(); ctx.moveTo(t.x1, hoop.y); ctx.lineTo(t.x2, hoop.y); ctx.stroke();
        }
        var rr = rimR();
        ctx.fillStyle = CORAL; ctx.strokeStyle = INK; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(t.x1, hoop.y, rr, 0, 6.2832); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(t.x2, hoop.y, rr, 0, 6.2832); ctx.fill(); ctx.stroke();
      }

      /* SECTION: render-fx */
      function drawPlaceGuide() {
        if (!drag || drag.grab !== true || !ballResting) return;
        var gy = groundY();
        var rx = Math.max(6, ballR * 1.15);
        var ry = Math.max(2.5, ballR * 0.3);
        ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.ellipse(ball.x, gy - 3, rx, ry, 0, 0, 6.2832);
        ctx.fillStyle = INK; ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ballR + 9, 0, 6.2832);
        ctx.strokeStyle = SUN; ctx.lineWidth = 5; ctx.setLineDash([]); ctx.stroke();
      }
      function drawAim() {
        if (!drag || drag.grab === true || !ballResting) return;
        var dx = drag.x0 - drag.x1, dy = drag.y0 - drag.y1;
        var len = Math.sqrt(dx * dx + dy * dy);
        if (len < 8) return;
        var sp = Math.min(len * LAUNCH_K, MAX_SPEED);
        var ux = dx / len, uy = dy / len;
        /* 力度环 */
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballR + 9, -Math.PI / 2, -Math.PI / 2 + (sp / MAX_SPEED) * 6.2832);
        ctx.strokeStyle = sp >= MAX_SPEED * 0.999 ? CORAL : TEAL;
        ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
        /* 方向短线 */
        ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(ball.x + ux * (ballR + 14), ball.y + uy * (ballR + 14));
        ctx.lineTo(ball.x + ux * (ballR + 30), ball.y + uy * (ballR + 30));
        ctx.stroke();
        /* 轨迹预测 */
        var sx = ball.x, sy = ball.y, svx = ux * sp, svy = uy * sp;
        var gy = groundY(), t = rimTips(), bx = boardX();
        var h = 1 / 60;
        ctx.fillStyle = INK;
        for (var i = 0; i < 48; i++) {
          svy += GRAVITY * h; sx += svx * h; sy += svy * h;
          if (sy + ballR > gy || sx > W + 30 || sx < -30) break;
          var hit = false;
          for (var k = 0; k < 2; k++) {
            var tx = k === 0 ? t.x1 : t.x2;
            var ddx = sx - tx, ddy = sy - hoop.y, rr2 = (ballR + rimR()) * (ballR + rimR());
            if (ddx * ddx + ddy * ddy < rr2) { hit = true; break; }
          }
          if (!hit && svx > 0 && sx + ballR > bx - boardR() && sy > boardTop() && sy < boardBot()) hit = true;
          if (hit) break;
          if (i % 2 === 0) {
            ctx.globalAlpha = Math.max(0.15, 0.85 - i * 0.016);
            ctx.beginPath(); ctx.arc(sx, sy, Math.max(2.2, 4.6 - i * 0.05), 0, 6.2832); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      }
      function drawParticles() {
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }
      function drawPopups() {
        for (var i = 0; i < popups.length; i++) {
          var p = popups[i];
          var a = Math.max(0, 1 - p.t);
          var yy = p.y - p.t * 70;
          ctx.font = '900 ' + Math.round(clampFont(20, W * 0.05, 30)) + 'px ' + FONT;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.globalAlpha = a;
          ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
          ctx.strokeText(p.txt, p.x, yy);
          ctx.fillStyle = p.c;
          ctx.fillText(p.txt, p.x, yy);
        }
        ctx.globalAlpha = 1;
      }
      function clampFont(min, v, max) { return Math.max(min, Math.min(max, v)); }
      function drawIdleHint() {
        if (mode !== 'play' || !ballResting || drag) return;
        var a = 0.45 + 0.25 * Math.sin(tNow * 3);
        ctx.globalAlpha = a;
        ctx.font = '700 ' + Math.round(clampFont(12, W * 0.03, 15)) + 'px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = INK;
        ctx.fillText('按住球停顿可任意摆放 · 快速拖拽蓄力投篮', Math.max(ball.x + 120, W * 0.3), ball.y - ballR - 34);
        ctx.globalAlpha = 1;
      }

      /* SECTION: render-main */
      function render() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (shakeT > 0) {
          ctx.translate((Math.random() - 0.5) * 7 * (shakeT / 0.16), (Math.random() - 0.5) * 7 * (shakeT / 0.16));
        }
        drawBG();
        drawSun();
        drawCloud();
        drawSkyline();
        drawGround();
        drawPoleBoard();
        drawBall();
        drawNet();
        drawRim();
        drawPlaceGuide();
        drawAim();
        drawParticles();
        drawPopups();
        drawIdleHint();
        ctx.restore();
      }

      /* SECTION: loop */
      var lastT = 0, acc = 0, STEP = 1 / 120;
      function loop(ts) {
        requestAnimationFrame(loop);
        tNow = ts / 1000;
        var dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0.016;
        lastT = ts;
        acc += dt;
        var guard = 0;
        while (acc >= STEP && guard < 12) { update(STEP); acc -= STEP; guard++; }
        if (guard >= 12) acc = 0;
        render();
      }

      /* SECTION: input */
      function canvasPos(e) {
        var r = cv.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      cv.addEventListener('pointerdown', function (e) {
        unlockAudio();
        if (mode !== 'play' || dragId !== null || !ballResting) return;
        e.preventDefault();
        dragId = e.pointerId;
        try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        var p = canvasPos(e);
        var dxb = p.x - ball.x, dyb = p.y - ball.y;
        var near = dxb * dxb + dyb * dyb <= grabRadius() * grabRadius();
        /* 按在球上：意图待定（快速拖动 = 蓄力发射；按住不动 = 拾取摆放） */
        drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, grab: near ? 'pending' : false, hold: 0, offX: 0, offY: 0 };
      });
      cv.addEventListener('pointermove', function (e) {
        if (dragId !== e.pointerId || !drag) return;
        var p = canvasPos(e);
        drag.x1 = p.x; drag.y1 = p.y;
        if (drag.grab === true && ballResting) {
          var bp = resolvePlacement(p.x + drag.offX, p.y + drag.offY);
          ball.x = bp.x; ball.y = bp.y;
        }
      });
      function release(e) {
        if (dragId !== e.pointerId) return;
        if (drag) {
          if (drag.grab === true) {
            var bp = resolvePlacement(drag.x1 + drag.offX, drag.y1 + drag.offY);
            ball.x = bp.x; ball.y = bp.y;
          } else {
            var dx = drag.x0 - drag.x1, dy = drag.y0 - drag.y1;
            var len = Math.sqrt(dx * dx + dy * dy);
            if (len >= DRAG_MIN && mode === 'play' && ballResting) {
              var sp = Math.min(len * LAUNCH_K, MAX_SPEED);
              ball.vx = dx / len * sp;
              ball.vy = dy / len * sp;
              ballResting = false;
              shot = { active: true, scored: false, swishable: true, touched: false, t: 0 };
              stats.att++;
              sfx('launch');
            }
          }
        }
        drag = null; dragId = null;
      }
      cv.addEventListener('pointerup', release);
      cv.addEventListener('pointercancel', release);
      cv.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

      /* SECTION: resize */
      var rzT = 0;
      window.addEventListener('resize', function () {
        clearTimeout(rzT);
        rzT = setTimeout(function () {
          var ow = W, oh = H;
          initCanvas();
          if (ow > 0 && oh > 0) {
            hoop.x = Math.min(Math.max(hoop.x * W / ow, W * 0.5), W * 0.9);
            hoop.y = Math.min(Math.max(hoop.y * H / oh, Math.max(150, H * 0.26)), H * 0.6);
            if (ballResting) {
              var bp = resolvePlacement(ball.x * W / ow, ball.y * H / oh);
              ball.x = bp.x; ball.y = bp.y;
            } else {
              ball.x = Math.min(Math.max(ball.x * W / ow, ballR), W - ballR);
              ball.y = Math.min(ball.y * H / oh, groundY() - ballR);
            }
          }
        }, 160);
      });

      /* SECTION: visibility */
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { lastT = 0; acc = 0; }
      });

      /* SECTION: buttons */
      btnStart.addEventListener('click', startGame);
      btnAgain.addEventListener('click', startGame);
      document.addEventListener('keydown', function (e) {
        if (e.target === btnStart || e.target === btnAgain) return;
        if ((e.key === 'Enter' || e.key === ' ') && (mode === 'ready' || mode === 'over')) {
          if (e.key === ' ') e.preventDefault();
          startGame();
        }
      });

      /* SECTION: boot */
      initCanvas();
      moveHoop();
      spawnBall();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
