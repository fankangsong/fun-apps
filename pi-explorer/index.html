<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>滚轮 · 发现圆周率</title>
<script src="../assets/p5.min.js"></script>
<style>
  :root {
    --paper: #f6f1e7; --ink: #161616; --coral: #ff6b6b; --teal: #2ec4b6;
    --sun: #ffd23f; --blue: #3a86ff; --pink: #ff8fab; --card: #fffdf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  /* Memphis 波点纹理 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .8;
    background-image:
      radial-gradient(#16161680 1px, transparent 1.6px),
      radial-gradient(#16161650 1px, transparent 1.6px);
    background-size: 34px 34px, 54px 54px;
    background-position: 0 0, 17px 27px;
  }
  canvas { position: fixed; inset: 0; z-index: 1; display: block; touch-action: none; }

  /* ============ 滚动字幕条 ============ */
  .marquee {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: var(--ink); color: var(--sun); overflow: hidden;
    font-size: 12px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    padding: 9px 0; padding-top: calc(9px + env(safe-area-inset-top, 0));
  }
  .marquee .in { display: inline-block; white-space: nowrap; animation: mq 44s linear infinite; }
  @keyframes mq { to { transform: translateX(-50%); } }

  /* ============ 左上品牌标题 ============ */
  .brand {
    position: fixed; z-index: 6; pointer-events: none;
    top: calc(46px + env(safe-area-inset-top, 0)); left: 28px;
  }
  .brand h1 {
    font-size: clamp(56px, 8vw, 96px); font-weight: 900; line-height: .9;
    color: var(--paper); letter-spacing: -.01em;
    text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 var(--teal);
  }
  .brand .badge {
    display: inline-block; margin-top: 14px; transform: rotate(-2deg);
    background: var(--ink); color: var(--paper);
    font-size: clamp(10px, 1.6vw, 12px); font-weight: 700;
    letter-spacing: .26em; text-transform: uppercase; padding: 8px 14px;
  }
  .brand .cn {
    display: block; margin-top: 10px;
    font-size: clamp(13px, 2vw, 16px); font-weight: 900; letter-spacing: .2em;
  }

  /* ============ 贴纸卡片（通用） ============ */
  .panel {
    position: fixed; z-index: 5;
    background: var(--card); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 6px 6px 0 var(--c, var(--ink));
    padding: 14px 16px;
    animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  @keyframes pop { from { opacity: 0; transform: rotate(var(--tilt, 0deg)) translateY(24px) scale(.96); } }
  .p-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: #6d675c; margin-bottom: 8px;
  }
  .p-label b { color: var(--ink); }

  /* 右上：滚动角度 */
  .p-angle {
    --c: var(--blue); --tilt: 1.2deg; transform: rotate(1.2deg);
    top: calc(46px + env(safe-area-inset-top, 0)); right: 28px; width: 232px;
    pointer-events: none;
  }
  .p-deg { font-size: 40px; font-weight: 900; line-height: 1; }
  .p-deg small { font-size: 20px; }
  .p-bar {
    margin: 10px 0 8px; height: 12px; border-radius: 999px;
    background: var(--paper); border: 2px solid var(--ink); overflow: hidden;
  }
  .p-bar i { display: block; height: 100%; width: 0; background: var(--coral); border-radius: 999px; }
  .p-sub { font-size: 12px; font-weight: 700; color: #3c3a33; letter-spacing: .04em; }

  /* 中上：读数（核心教学） */
  .p-read {
    --c: var(--teal); --tilt: -1.2deg; transform: rotate(-1.2deg);
    top: calc(52px + env(safe-area-inset-top, 0)); left: 50%;
    translate: -50% 0; width: min(92vw, 380px);
    text-align: center; pointer-events: none;
  }
  .p-line1 { font-size: clamp(15px, 2.6vw, 19px); font-weight: 900; }
  .p-line2 { font-size: 12.5px; font-weight: 700; color: #3c3a33; margin-top: 4px; letter-spacing: .03em; }
  .p-ratio {
    margin-top: 10px; padding-top: 10px; border-top: 2px dashed #d8d2c4;
    display: flex; align-items: baseline; justify-content: center; gap: 10px;
  }
  .p-ratio b { font-size: clamp(24px, 4vw, 32px); font-weight: 900; color: var(--coral); }
  .p-ratio span { font-size: 11px; font-weight: 700; color: #6d675c; letter-spacing: .1em; }

  /* 底部：轮子大小滑杆（卡片本体穿透，仅滑杆拦截触摸） */
  .p-slider {
    --c: var(--pink); --tilt: -1deg; transform: rotate(-1deg);
    right: 28px; bottom: calc(24px + env(safe-area-inset-bottom, 0));
    width: min(300px, calc(100vw - 56px));
    pointer-events: none;
  }
  .p-slider input[type="range"] { pointer-events: auto; }
  .p-slider input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; background: transparent; cursor: pointer;
    touch-action: manipulation; margin: 0;
  }
  .p-slider input[type="range"]::-webkit-slider-runnable-track {
    height: 12px; border-radius: 999px;
    background: var(--paper); border: 2px solid var(--ink);
  }
  .p-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 34px; height: 34px; margin-top: -13px; border-radius: 50%;
    background: var(--sun); border: 3px solid var(--ink);
    box-shadow: inset 0 -4px 0 rgba(22, 22, 22, .18);
  }
  .p-slider input[type="range"]::-moz-range-track {
    height: 12px; border-radius: 999px; background: var(--paper); border: 2px solid var(--ink);
  }
  .p-slider input[type="range"]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--sun); border: 3px solid var(--ink);
  }
  .p-slider input[type="range"]:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; border-radius: 999px; }
  .p-hint { font-size: 11px; font-weight: 700; color: #6d675c; letter-spacing: .06em; margin-top: 6px; }

  /* ============ 角落标注 ============ */
  .corner {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0)); z-index: 6;
    font-size: 10.5px; font-weight: 700; letter-spacing: .3em;
    text-transform: uppercase; color: #6d675c; pointer-events: none;
  }
  .corner-l { left: 26px; }
  .corner-r { right: 26px; }

  /* ============ 响应式：中屏（641~980px，读数卡移到标题下方左侧） ============ */
  @media (max-width: 980px) and (min-width: 641px) {
    .p-read {
      top: calc(196px + env(safe-area-inset-top, 0));
      left: 28px; translate: 0 0; width: min(440px, calc(100vw - 56px));
      text-align: left;
    }
    .p-ratio { justify-content: flex-start; }
  }

  /* ============ 响应式：小屏（< 640px，覆盖 iPad 分屏 320px） ============ */
  @media (max-width: 640px) {
    .brand { top: calc(40px + env(safe-area-inset-top, 0)); left: 16px; }
    .brand h1 { font-size: 44px; }
    .brand .cn { font-size: 12px; letter-spacing: .12em; }
    .brand .badge { margin-top: 8px; padding: 5px 10px; font-size: 9px; }
    .p-angle {
      top: calc(40px + env(safe-area-inset-top, 0)); right: 12px; width: 132px;
      padding: 10px 12px; transform: rotate(1.6deg);
    }
    .p-deg { font-size: 24px; }
    .p-deg small { font-size: 13px; }
    .p-sub { font-size: 10px; }
    .p-read {
      top: calc(136px + env(safe-area-inset-top, 0)); width: calc(100vw - 24px);
      padding: 10px 12px;
    }
    .p-line1 { font-size: 14px; }
    .p-line2 { font-size: 11px; }
    .p-ratio b { font-size: 20px; }
    .p-slider { right: 12px; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0)); width: auto; padding: 10px 14px; }
    .corner-r { display: none; }
    .corner-l { bottom: calc(136px + env(safe-area-inset-bottom, 0)); left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee .in { animation: none; }
    .panel { animation: none; }
  }
</style>
</head>
<body>
  <div class="marquee" aria-hidden="true"><div class="in" id="mq"></div></div>

  <header class="brand" aria-hidden="true">
    <h1>π</h1>
    <span class="cn">滚轮发现圆周率</span>
    <p class="badge">rolling to π · nº 03</p>
  </header>

  <aside class="panel p-angle" aria-hidden="true">
    <div class="p-label">滚动角度 · live</div>
    <div class="p-deg"><span id="degNum">0.0</span><small>°</small></div>
    <div class="p-bar"><i id="degBar"></i></div>
    <div class="p-sub" id="degSub">0.0° ≈ 0.00 rad</div>
  </aside>

  <aside class="panel p-read" aria-hidden="true">
    <div class="p-line1" id="readLine1">轮子在 0 刻度上，拖动它滚起来！</div>
    <div class="p-line2" id="readLine2">滚动圆周指数：转一整圈 = π ≈ 3.14 格</div>
    <div class="p-ratio"><b id="readRatio">π</b><span id="readRatioTip">滚起来后实时计算</span></div>
  </aside>

  <aside class="panel p-slider">
    <div class="p-label">轮子大小 · <b id="dVal">100</b> px</div>
    <input type="range" id="dRange" min="40" max="170" value="100" step="1" aria-label="调整轮子直径">
    <div class="p-hint">拖动轮子滚动 · 点直尺任意处滚过去</div>
  </aside>

  <div class="corner corner-l" aria-hidden="true">fun apps · π explorer</div>
  <div class="corner corner-r" aria-hidden="true">滚一滚 · 点一点 · nº 03</div>

<script>
p5.disableFriendlyErrors = true;

// ================= Memphis 色板（与 DESIGN.md 一致） =================
const PAPER = '#f6f1e7', INK = '#161616', CORAL = '#ff6b6b', TEAL = '#2ec4b6',
      SUN = '#ffd23f', BLUE = '#3a86ff', PINK = '#ff8fab', CARD = '#fffdf6';

// ================= 配置 =================
const D_MIN = 40;
let D_MAX = 170;
const RH = 84;              // 直尺高度
let startX = 190;           // 直尺 0 刻度（轮子出发圆心）

// ================= 状态 =================
let d = 100;                // 轮子直径
let x = 0, targetX = null;
let roll = 0, turns = 0;
let badgeTimer = 0, stars = [];
let dragging = false, dragDX = 0;
let mode = 'none';          // 'none' | 'wheel'
let hoverCell = -1;
let roadY = 500;
let rulerX0 = 16;

const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const D = () => d, R = () => d / 2;

// ================= DOM 引用 =================
let degNum, degBar, degSub, readLine1, readLine2, readRatio, readRatioTip, dRange, dVal;

function setup() {
  createCanvas(innerWidth, innerHeight);
  textFont('"Avenir Next","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif');
  textAlign(CENTER, CENTER);

  degNum = document.getElementById('degNum');
  degBar = document.getElementById('degBar');
  degSub = document.getElementById('degSub');
  readLine1 = document.getElementById('readLine1');
  readLine2 = document.getElementById('readLine2');
  readRatio = document.getElementById('readRatio');
  readRatioTip = document.getElementById('readRatioTip');
  dRange = document.getElementById('dRange');
  dVal = document.getElementById('dVal');

  document.getElementById('mq').textContent =
    'π ≈ 3.14159 · 滚一滚 · 量一量 · 无规则 · 只管好玩 · ROLLING TO π · '.repeat(24);

  dRange.addEventListener('input', () => {
    d = +dRange.value;
    dVal.textContent = d;
    syncRoll(false);
  });

  layout();
  x = startX;

  // 后台暂停，恢复时 rAF 自然续跑（本作全部按当帧状态绘制，无帧数累加）
  document.addEventListener('visibilitychange', () => document.hidden ? noLoop() : loop());
}

function layout() {
  const narrow = width < 640;
  D_MAX = narrow ? 120 : 170;
  dRange.max = D_MAX;
  if (d > D_MAX) { d = D_MAX; dRange.value = d; dVal.textContent = d; }
  roadY = height * (narrow ? 0.66 : 0.72);
  startX = max(narrow ? 96 : 150, width * (narrow ? 0.3 : 0.15));
  rulerX0 = max(14, startX - 110);
  x = constrain(x, startX, width - 60);
}

function windowResized() {
  resizeCanvas(innerWidth, innerHeight);
  layout();
}

// ================= 主循环 =================
function draw() {
  if (targetX !== null) {
    x += (targetX - x) * 0.16;
    if (abs(targetX - x) < 0.6) { x = targetX; targetX = null; }
    syncRoll(true);
  }
  updateHover();

  clear();                  // 透明画布，透出 body 波点纹理
  drawRuler();
  drawFlags();
  drawCaliper();
  drawWheel();
  drawStars();
  drawBadge();
  if (frameCount % 3 === 0) updatePanels();
}

function syncRoll(celebrate) {
  roll = x - startX;
  const per = PI * D();
  const nt = floor(roll / per);
  while (turns < nt) {
    turns++;
    if (celebrate) { badgeTimer = 200; spawnStars(); }
  }
  if (turns > nt) turns = nt;
}

// ================= hover：直尺单元格（桌面 hover；触屏点按直尺=滚过去） =================
function cellAt(px, py) {
  if (py > roadY && py < roadY + RH && px >= startX && px < width)
    return floor((px - startX) / D());
  return -1;
}
function updateHover() {
  if (mode !== 'none' || isTouchDevice) { hoverCell = -1; return; }
  hoverCell = cellAt(mouseX, mouseY);
}

// ================= 绘制：直尺（贴纸） =================
function drawRuler() {
  // 硬阴影 + 纸白贴纸
  noStroke(); fill(INK);
  rect(rulerX0 + 5, roadY + 5, width - 14 - rulerX0, RH, 14);
  noStroke(); fill(CARD);
  rect(rulerX0, roadY, width - 14 - rulerX0, RH, 14);
  stroke(INK); strokeWeight(3); noFill();
  rect(rulerX0, roadY, width - 14 - rulerX0, RH, 14);

  for (let i = 0; ; i++) {
    const tx = startX + i * D();
    if (tx > width - 6) break;
    const hovered = (i === hoverCell);

    if (hovered) {                                   // hover 格：明黄整格
      noStroke(); fill(255, 210, 63, 110);
      rect(tx + 2, roadY + 2, D() - 4, RH - 4, 10);
    } else if (roll > i * D() + 1) {                 // 已滚过：顶部黄条
      noStroke(); fill(255, 210, 63, 140);
      rect(tx + 2, roadY + 2, D() - 4, 20, 8);
    }
    stroke(INK); strokeWeight(hovered ? 5 : 3);      // 主刻度
    line(tx, roadY, tx, roadY + 46);
    stroke('#6d675c'); strokeWeight(2);              // 1/4 细分刻度
    for (let j = 1; j <= 3; j++) {
      const mx = tx + j * D() / 4;
      if (mx > width - 6) break;
      line(mx, roadY, mx, roadY + 18);
    }
    noStroke(); fill(hovered ? CORAL : INK);
    textSize(width < 640 ? 22 : 28);
    text(str(i), tx, roadY + 62);
  }
}

// ================= 绘制：整圈小旗（矢量，替换 emoji） =================
function drawFlags() {
  textSize(width < 640 ? 13 : 16);
  for (let k = 1; k <= turns; k++) {
    const fx = startX + k * PI * D();
    if (fx > width - 10) break;
    const fy = roadY + RH + 12;
    stroke(INK); strokeWeight(3);                    // 旗杆
    line(fx, fy, fx, fy - 30);
    noStroke(); fill(CORAL);                         // 三角旗面
    triangle(fx, fy - 30, fx + 26, fy - 22, fx, fy - 14);
    // 第 k 圈徽章贴纸
    const label = '第 ' + k + ' 圈';
    const bw = textWidth(label) + 20;
    const bx = constrain(fx + 14, 6, width - bw - 6);
    noStroke(); fill(INK);  rect(bx + 3, fy + 3, bw, 26, 13);
    noStroke(); fill(SUN);   rect(bx, fy, bw, 26, 13);
    noStroke(); fill(INK);
    text(label, bx + bw / 2, fy + 13);
  }
}

// ================= 绘制：卡尺（轮宽 = 1 格） =================
function drawCaliper() {
  const hi = hoverCell >= 0;
  const cL = x - R(), cR = x + R();

  if (hi) {                                          // 悬停格边界虚线上引
    const hx0 = startX + hoverCell * D(), hx1 = hx0 + D();
    stroke(CORAL); strokeWeight(3);
    drawingContext.setLineDash([6, 6]);
    line(hx0, roadY, hx0, roadY - D() - 60);
    line(hx1, roadY, hx1, roadY - D() - 60);
    drawingContext.setLineDash([]);
  }
  // 轮缘虚线垂线
  stroke(hi ? CORAL : color(22, 22, 22, 150));
  strokeWeight(hi ? 3.5 : 2);
  drawingContext.setLineDash([6, 6]);
  line(cL, roadY - D() - 20, cL, roadY);
  line(cR, roadY - D() - 20, cR, roadY);
  drawingContext.setLineDash([]);

  // 双箭头标注线（hover 时脉冲强调）
  const ay = roadY - D() - 34;
  const pulse = hi ? (2 + sin(frameCount * 0.25)) : 0;
  stroke(CORAL); strokeWeight(hi ? 4 + pulse : 3);
  line(cL, ay, cR, ay);
  for (const ex of [cL, cR]) {
    const s = ex === cL ? 10 : -10;
    line(ex, ay, ex + s, ay - 7);
    line(ex, ay, ex + s, ay + 7);
  }
  // 标注小贴纸
  const label = hi ? '看！这一格的宽 = 轮子的宽（直径）' : '轮子的宽 = 1 格';
  const fs = width < 700 ? (hi ? 14 : 12) : (hi ? 20 : 17);
  textSize(fs);
  const bw = textWidth(label) + 24;
  const bx = constrain(x - bw / 2, 6, width - bw - 6);
  const by = ay - 40 - pulse;
  noStroke(); fill(INK);  rect(bx + 3, by + 3, bw, fs + 16, 12);
  noStroke(); fill(CARD); rect(bx, by, bw, fs + 16, 12);
  noStroke(); fill(hi ? CORAL : INK);
  text(label, bx + bw / 2, by + (fs + 16) / 2);
}

// ================= 绘制：轮子（黄面黑边 + 珊瑚标记） =================
function drawWheel() {
  const cy = roadY - R();
  push();
  translate(x, cy);
  noStroke(); fill(INK);  circle(5, 5, D());         // 硬阴影
  noStroke(); fill(SUN);   circle(0, 0, D());        // 轮面
  noFill(); stroke(INK); strokeWeight(4);
  circle(0, 0, D());                                  // 黑描边

  rotate(roll / R());                                 // 纯滚动
  stroke(INK); strokeWeight(3);                       // 四根辐条
  for (let i = 0; i < 4; i++) { line(0, -10, 0, -(R() - 12)); rotate(HALF_PI); }
  stroke(CORAL); strokeWeight(6);                     // 红色标记（从正下方出发）
  line(0, 0, 0, R() - 10);
  noStroke(); fill(CORAL); circle(0, R() - 10, 14);
  pop();
  // 中心轴点（不随旋转，视觉稳定）
  noStroke(); fill(INK); circle(x, cy, 9);
  // 内虚线圆环（Memphis 呼应）
  noFill(); stroke(22, 22, 22, 110); strokeWeight(3);
  drawingContext.setLineDash([2, 10]);
  circle(x, cy, D() - 26);
  drawingContext.setLineDash([]);
}

// ================= 反馈：星星 / 奖章 =================
function spawnStars() {
  const cols = [SUN, CORAL, TEAL, PINK, BLUE];
  for (let i = 0; i < 26; i++)
    stars.push({ x, y: roadY - D(), vx: random(-4, 4), vy: random(-9, -3),
                 life: 60, r: random(7, 14), c: color(cols[i % 5]), spin: random(TWO_PI) });
}
function drawStars() {
  for (const s of stars) {
    s.x += s.vx; s.y += s.vy; s.vy += 0.25; s.life--; s.spin += 0.1;
    drawStarShape(s.x, s.y, s.r, s.c, s.spin, min(s.life * 4, 255));
  }
  stars = stars.filter(s => s.life > 0);
}
function drawStarShape(sx, sy, r, c, rot, alpha) {
  push(); translate(sx, sy); rotate(rot);
  noStroke(); fill(c, alpha);
  beginShape();
  for (let i = 0; i < 10; i++) {
    const a = i * TWO_PI / 10 - HALF_PI;
    const rr = i % 2 === 0 ? r : r * 0.45;
    vertex(cos(a) * rr, sin(a) * rr);
  }
  endShape(CLOSE);
  pop();
}

function drawBadge() {
  if (badgeTimer <= 0) return;
  push();
  translate(x, roadY - D() - 120);
  scale(1 + 0.05 * sin(badgeTimer * 0.3));
  const label = '3 格多一点！';
  textSize(width < 640 ? 20 : 28);
  const bw = textWidth(label) + (width < 640 ? 36 : 56);
  const bh = width < 640 ? 50 : 68;
  noStroke(); fill(INK);  rect(-bw / 2 + 5, -bh / 2 + 5, bw, bh, 18);   // 硬阴影
  noStroke(); fill(SUN);   rect(-bw / 2, -bh / 2, bw, bh, 18);
  stroke(INK); strokeWeight(3); noFill();
  rect(-bw / 2, -bh / 2, bw, bh, 18);
  noStroke(); fill(INK);
  text(label, 0, 0);
  pop();
  badgeTimer--;
}

// ================= DOM 面板实时刷新 =================
function updatePanels() {
  const rad = roll / R();
  const deg = rad * 180 / PI;
  const full = floor(deg / 360), rem = deg - full * 360;
  degNum.textContent = nf(deg, 1, 1);
  degBar.style.width = (rem / 360 * 100) + '%';
  degSub.textContent = (full > 0 ? full + ' 圈 + ' : '') + nf(rem, 1, 1) + '° ≈ ' + nf(rad, 1, 2) + ' rad';

  const cells = floor(roll / D()), extra = roll - cells * D();
  readLine1.textContent = roll > 1
    ? (extra < 2 ? '正好走过了 ' + cells + ' 格' : '走过 ' + cells + ' 格 + 一小截')
    : '轮子在 0 刻度上，拖动它滚起来！';

  const laps = roll / (PI * D()), grids = roll / D();
  if (laps < 0.005) {
    readLine2.textContent = '滚动圆周指数：转一整圈 = π ≈ 3.14 格';
    readRatio.textContent = 'π';
    readRatioTip.textContent = '滚起来后实时计算';
  } else {
    readLine2.textContent = nf(laps, 1, 2) + ' 圈 · ' + nf(grids, 1, 2) + ' 格';
    readRatio.textContent = nf(grids / laps, 1, 4);
    readRatioTip.textContent = '格数 ÷ 圈数 ≈ π';
  }
}

// ================= 交互 =================
// 触摸端由 p5 自动将 touch 事件映射为 mouse*（配合 canvas 的 touch-action: none 阻止滚动）
function mousePressed() {
  if (dist(mouseX, mouseY, x, roadY - R()) < R() + 34) {
    mode = 'wheel'; dragging = true; dragDX = x - mouseX; targetX = null;
    return;
  }
  if (mouseY > roadY && mouseY < roadY + RH) {        // 点直尺 → 滚过去
    targetX = constrain(mouseX, startX, width - 60);
  }
}
function mouseDragged() {
  if (dragging) {
    x = constrain(mouseX + dragDX, startX, width - 60);
    syncRoll(true);
  }
}
function mouseReleased() { dragging = false; mode = 'none'; }
</script>
