<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>小游戏合集 · p5.js + Matter.js</title>
  <script>p5 && (p5.disableFriendlyErrors = true);</script>
  <style>
    :root {
      --bg: #0e1116;
      --bg-soft: #151b24;
      --card: #1b2230;
      --card-hover: #232c3d;
      --line: #2a3445;
      --text: #c8d4e0;
      --muted: #7e8da0;
      --accent: #7fd4ff;
      --accent-2: #ff8a5b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, #16202e 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 40px);
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .note {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      position: relative;
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      cursor: pointer;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--accent);
      outline: none;
    }
    .thumb {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      background:
        radial-gradient(circle at 30% 30%, rgba(127,212,255,.18), transparent 60%),
        radial-gradient(circle at 70% 70%, rgba(255,138,91,.16), transparent 60%),
        var(--bg-soft);
      border-bottom: 1px solid var(--line);
    }
    .meta { padding: 16px 18px 18px; }
    .meta h2 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
    }
    .meta .desc {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      min-height: 38px;
    }
    .meta .tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .tag.accent { color: var(--accent); border-color: rgba(127,212,255,.4); }
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 480px) {
      .wrap { padding: 32px 16px 48px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>小游戏合集</h1>
      <p>p5.js + Matter.js · 2D 物理小游戏 · 桌面 / iPad Safari</p>
      <span class="note" id="count">加载中…</span>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      点击卡片进入游戏 · 所有游戏均无需本地服务器，离线可直接运行
    </footer>
  </div>

  <script>
    // =====================================================================
    // 游戏清单：如新增游戏，在此追加一项即可（页面自动渲染）。
    //  - dir : apps/ 下的相对目录名
    //  - entry : 该目录下的入口 html 文件名
    //  - icon : 卡片缩略图 emoji
    //  - name / desc : 展示用名称与简介
    //  - tags : 卡片底部标签
    // =====================================================================
    const GAMES = [
      {
        dir: 'basketball-2d',
        entry: 'basketball.html',
        icon: '🏀',
        name: '投篮大师',
        desc: '弹弓式投篮，自由摆放位置，距离越远得分越高，空心球翻倍。',
        tags: ['物理投掷', '单人对战', '计分'],
      },
      {
        dir: 'duel-balls',
        entry: 'index.html',
        icon: '⚡',
        name: '双人对撞球',
        desc: '上下分屏类 Pong 双人对战，板子接球回击，难度可选。',
        tags: ['双人对战', 'Pong', '难度分级'],
      },
      {
        dir: 'pi-explorer',
        entry: 'index.html',
        icon: 'π',
        name: 'π 实验室',
        desc: '四场景交互式理解圆周率：滚轮展开定义、多圆对比常数性、分数搜索无理性、割圆术逼近史。',
        tags: ['数学可视化', '交互实验', 'π 的四个侧面'],
      },
      {
        dir: 'circle-area',
        entry: 'index.html',
        icon: '🍕',
        name: '圆的面积',
        desc: '把圆剪开重拼成长方形，直观推导 S = πr²。调节半径与扇形数，观察面积不变。',
        tags: ['数学可视化', '剪拼推导', 'πr²'],
      },
    ];

    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');

    GAMES.forEach((g) => {
      const url = g.dir + '/' + g.entry;
      const card = document.createElement('a');
      card.className = 'card';
      card.href = url;
      card.setAttribute('aria-label', g.name);

      const tagsHtml = (g.tags || [])
        .map((t, i) => `<span class="tag${i === 0 ? ' accent' : ''}">${t}</span>`)
        .join('');

      card.innerHTML = `
        <div class="thumb">${g.icon || '🎮'}</div>
        <div class="meta">
          <h2>${g.name}</h2>
          <p class="desc">${g.desc || ''}</p>
          <div class="tags">${tagsHtml}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    countEl.textContent = `共 ${GAMES.length} 款游戏`;
  </script>
</body>
</html>
