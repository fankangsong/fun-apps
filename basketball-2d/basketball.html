<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>投篮机 · the basket-thrower</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<script>p5.disableFriendlyErrors = true;</script>
<style>
  /* =====================================================================
   * 设计 Tokens（Memphis，强制）
   * ===================================================================*/
  :root {
    --paper: #f6f1e7;  /* 纸色：画布 / 页面底色 */
    --ink:   #161616;  /* 墨黑：文字、描边、硬阴影 */
    --coral: #ff6b6b;  /* 珊瑚红 */
    --teal:  #2ec4b6;  /* 青绿 */
    --sun:   #ffd23f;  /* 明黄 */
    --blue:  #3a86ff;  /* 宝蓝 */
    --pink:  #ff8fab;  /* 粉 */
    --card:  #fffdf6;  /* 贴纸底 */
    --dim:   #6d675c;  /* 弱化文字 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  canvas { display: block; touch-action: none; position: fixed; inset: 0; z-index: 1; }

  /* ===================== 顶部滚动字幕 ===================== */
  .marquee {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: var(--ink); color: var(--sun); overflow: hidden;
    font-size: 12px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    padding: 9px 0; padding-top: calc(9px + env(safe-area-inset-top, 0));
    pointer-events: none;
  }
  .marquee .in { display: inline-block; white-space: nowrap; animation: mq 22s linear infinite; }
  @keyframes mq { to { transform: translateX(-50%); } }

  /* ===================== 顶部标题条 ===================== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: calc(44px + env(safe-area-inset-top, 0)) clamp(12px, 3vw, 28px) 6px;
    pointer-events: none;
  }
  .wordmark h1 {
    font-size: clamp(22px, 4.5vw, 40px); font-weight: 900; line-height: .95;
    letter-spacing: -.01em; color: var(--paper);
    text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--coral);
    display: inline-block;
  }
  .wordmark .pop { color: var(--sun); text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 var(--blue); }
  .badge {
    display: inline-block; margin-top: 8px;
    font-size: clamp(10px, 2.4vw, 12px); font-weight: 700;
    letter-spacing: .3em; text-transform: uppercase;
    background: var(--ink); color: var(--paper);
    padding: 7px 14px; transform: rotate(-2deg);
  }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
  .scorechip {
    background: var(--card); border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 4px 4px 0 var(--teal);
    padding: 8px 16px; transform: rotate(1.5deg);
    font-size: clamp(15px, 3.4vw, 22px); font-weight: 900; letter-spacing: .04em;
    white-space: nowrap;
  }
  .scorechip .lb { font-size: 10px; font-weight: 700; letter-spacing: .2em; color: var(--dim); display: block; text-transform: uppercase; }
  .hintchip {
    background: var(--card); border: 2px dashed var(--ink); border-radius: 10px;
    padding: 6px 12px; font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: .06em;
    max-width: 260px; line-height: 1.5; pointer-events: none;
  }

  /* ===================== 右下角按钮（贴纸） ===================== */
  .btns {
    position: fixed; right: clamp(12px, 3vw, 26px);
    bottom: calc(16px + env(safe-area-inset-bottom, 0)); z-index: 20;
    display: flex; gap: 12px; pointer-events: none;
  }
  .btn {
    pointer-events: auto; cursor: pointer;
    font-family: inherit; font-weight: 900; font-size: clamp(14px, 3vw, 17px);
    background: var(--card); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 4px 4px 0 var(--c, var(--ink));
    padding: 12px 18px; transform: rotate(var(--tilt, 0deg));
    touch-action: manipulation;
    transition: transform .22s cubic-bezier(.3, 1.6, .5, 1), box-shadow .22s;
  }
  .btn.primary { background: var(--teal); }
  .btn.secondary { background: var(--card); }
  @media (hover: hover) {
    .btn:hover { transform: rotate(0deg) translateY(-3px); box-shadow: 6px 7px 0 var(--c, var(--ink)); }
  }
  .btn:active { transform: translateY(2px) rotate(0); box-shadow: 1px 1px 0 var(--c, var(--ink)); }
  .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @media (max-width: 520px) {
    .btn.secondary { display: none; }
  }

  /* ===================== 角落标注 ===================== */
  .corner {
    position: fixed; bottom: 18px; z-index: 15;
    font-size: 10.5px; font-weight: 700; letter-spacing: .3em;
    text-transform: uppercase; color: var(--dim); pointer-events: none;
  }
  .corner-l { left: 18px; }
  .corner-r { right: 18px; }
  @media (max-width: 640px) { .corner-r { display: none; } }

  /* ===================== 散落 Memphis 图形（点按换色） ===================== */
  .deco-wrap { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .sh {
    position: absolute; cursor: pointer; pointer-events: auto;
    touch-action: manipulation; will-change: transform;
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), rotate .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  @media (hover: hover) { .sh:hover { transform: scale(1.12); } }
  .sh:active { transform: scale(.94); }
  .sh svg { display: block; width: 100%; height: 100%; overflow: visible; }

  @media (prefers-reduced-motion: reduce) {
    .marquee .in { animation: none; }
    .sh, .btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="marquee" aria-hidden="true"><div class="in" id="mq"></div></div>

  <header class="topbar">
    <div class="wordmark">
      <h1>BASKET<br><span class="pop">THROWER</span></h1>
      <p class="badge">弹弓式投篮 · 越远分越高</p>
    </div>
    <div class="hud-right">
      <div class="scorechip" id="scorechip"><span class="lb">命中 · score</span><span id="scoreval">0 / 0</span></div>
      <div class="hintchip">空白处反向拖拽释放投篮 · 拖动篮球可摆位 · 空心球翻倍</div>
    </div>
  </header>

  <div class="btns">
    <button class="btn secondary" id="replayBtn" style="--c:var(--blue);--tilt:1.2deg">↺ 回放</button>
    <button class="btn primary" id="retryBtn" style="--c:var(--coral);--tilt:-1.2deg">再投一次</button>
  </div>

  <div class="corner corner-l" aria-hidden="true">fun apps society · est. 2026</div>
  <div class="corner corner-r" aria-hidden="true">memphis vibes · nº 08</div>

  <div class="deco-wrap" id="decoWrap"></div>

<script>
// =====================================================================
// 物理 / 手感参数（全部可调）
// =====================================================================
const CONFIG = {
  // --- 重力与运动 ---
  gravity: 0.55,          // 每帧向下加速度 (px/frame^2)
  airDrag: 0.999,         // 空气阻力，每帧速度乘以此值 (1 = 无阻力)
  timeScale: 1.0,         // 全局时间缩放，调慢看轨迹用

  // --- 投掷力度 ---
  powerScale: 0.22,       // 拖拽距离 -> 初速度 的转换系数
  maxDragDist: 320,       // 拖拽距离上限（超过按上限算）
  minDragDist: 12,        // 小于此距离视为无效投掷

  // --- 篮球 ---
  ballRadius: 16,
  ballStartX: 160,
  ballStartYOffset: 140,  // 距离画布底部的高度

  // --- 篮筐 ---
  hoopXRatio: 0.82,       // 篮筐圈中心 X 占画布宽度的比例（靠右）
  hoopYOffset: 300,       // 篮筐距离画布底部高度
  hoopRadius: 44,         // 篮圈半径（水平半宽）
  rimThickness: 5,
  backboardH: 150,
  backboardOffset: 26,    // 篮板内表面相对篮圈后缘的偏移
  rimArm: 22,             // 篮圈从篮板伸出的水平臂长
  poleGap: 64,            // 立柱中心相对篮板内表面的水平间距
  netH: 70,               // 网兜自然下垂高度
  netSeg: 7,              // 网兜竖直段数
  netCols: 9,             // 网兜圆周方向网格数
  netStiff: 0.18,         // 网兜弹簧刚度
  netDamp: 0.86,          // 网兜阻尼
  netSwing: 0.25,         // 网兜受风/随机微扰强度

  // --- 碰撞 ---
  restitution: 0.55,      // 撞篮板/篮筐的弹性系数
  friction: 0.85,         // 碰撞后切向速度保留
  groundBounce: 0.45,
  groundFriction: 0.8,

  // --- 轨迹 ---
  trailMaxLen: 90,
  trailFadeIn: 10,
  trailLife: 55,
  trailWeightMax: 5,

  // --- 预测虚线 ---
  aimPreviewSteps: 46,
  aimPreviewGap: 3,

  // --- 判定 ---
  scoreVyMin: 0.5,

  // --- 分线 ---
  lineThree: 360,
  lineTwo: 200,
  lineOne: 80,

  // --- 彩带庆祝 ---
  confettiCount: 140,
  confettiLife: 220,
};

/* Memphis 调色板（画布内统一取色自 Tokens） */
const PALETTE = {
  bg:    '#f6f1e7',  // --paper
  dotA:  '#161616',
  dotB:  '#161616',
  ground:'#ece3cf',  // 场地色带（略深于纸色）
  ball:  '#ff6b6b',  // --coral
  ballLine:'#161616',
  rim:   '#ff6b6b',  // --coral
  board: '#3a86ff',  // --blue
  pole:  '#161616',
  net:   '#6d675c',
  trail: '#2ec4b6',  // --teal
  aim:   '#3a86ff',  // --blue
  ok:    '#2ec4b6',  // --teal
  miss:  '#ff6b6b',  // --coral
  swish: '#ffd23f',  // --sun
  ink:   '#161616',
  paper: '#f6f1e7',
  dim:   '#6d675c',
};

// =====================================================================
// 状态
// =====================================================================
const STATE = { READY: 'ready', FLY: 'fly', WAITING: 'waiting', REPLAY: 'replay' };

let state = STATE.READY;
let ball;
let trail = [];
let dragging = false;
let repositioning = false;
let dragStart, dragNow;

let hoop;
let groundY;

let score = 0, attempts = 0;
let passedRimTop = false;
let resultText = '', resultColor, resultTimer = 0;
let scoreFlash = 0;
let scoredOnce = false;
let touched = false;
let shotStartX = 0;
let confetti = [];
let celebrate = 0;

// --- 回放 ---
let flightPath = [];
let replayIdx = 0;
let replayGhost;

// --- 篮网物理 ---
let net = null;

// --- 活动指针坐标（鼠标/触控统一） ---
let pointerX = 0, pointerY = 0, pointerActive = false;

// =====================================================================
// Input — Pointer Events 统一输入层（兼容鼠标 + 触屏）
// =====================================================================
const Input = (function () {
  let canvasEl = null;
  let activePointerId = null;
  let downPos = null;
  const handlers = {
    onTap:       null,
    onDragStart: null,
    onDrag:      null,
    onDragEnd:   null,
  };

  function bind(p5Inst) {
    canvasEl = p5Inst.canvas;
    canvasEl.style.touchAction = 'none';

    canvasEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      const { x, y } = toCanvasCoords(e);
      pointerX = x; pointerY = y; pointerActive = true;
      downPos = { x, y };
      if (handlers.onDragStart) handlers.onDragStart(x, y);
    });

    canvasEl.addEventListener('pointermove', (e) => {
      const { x, y } = toCanvasCoords(e);
      pointerX = x; pointerY = y;
      if (activePointerId === e.pointerId) {
        if (handlers.onDrag) handlers.onDrag(x, y);
      }
    });

    const end = (e) => {
      if (activePointerId !== e.pointerId) return;
      const { x, y } = toCanvasCoords(e);
      pointerX = x; pointerY = y;
      if (downPos) {
        const moved = Math.hypot(x - downPos.x, y - downPos.y);
        if (moved < 8 && handlers.onTap) handlers.onTap(x, y);
        downPos = null;
      }
      if (handlers.onDragEnd) handlers.onDragEnd(x, y);
      activePointerId = null;
      pointerActive = false;
    };
    canvasEl.addEventListener('pointerup', end);
    canvasEl.addEventListener('pointercancel', end);
  }

  function toCanvasCoords(e) {
    const rect = canvasEl.getBoundingClientRect();
    const sx = canvasEl.width / rect.width / (window.devicePixelRatio || 1);
    const sy = canvasEl.height / rect.height / (window.devicePixelRatio || 1);
    return {
      x: (e.clientX - rect.left) * sx,
      y: (e.clientY - rect.top) * sy,
    };
  }

  function setHandlers(obj) { Object.assign(handlers, obj); }

  return { bind, setHandlers };
})();

// =====================================================================
function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  computeLayout();
  resetBall();
  Input.bind(this);
  Input.setHandlers({
    onDragStart: handleDragStart,
    onDrag:      handleDrag,
    onDragEnd:   handleDragEnd,
    onTap:       handleTap,
  });
  syncScoreChip();
}

function computeLayout() {
  groundY = height - 60;
  const maxHoopX = width - 20 - CONFIG.poleGap - CONFIG.backboardOffset - CONFIG.hoopRadius;
  hoop = {
    x: min(width * CONFIG.hoopXRatio, maxHoopX),
    y: height - CONFIG.hoopYOffset,
    r: CONFIG.hoopRadius,
  };
  hoop.boardX = hoop.x + hoop.r + CONFIG.backboardOffset;
  hoop.poleX = hoop.boardX + CONFIG.poleGap;
  initNet();
}

function initNet() {
  net = [];
  const rings = CONFIG.netSeg + 1;
  for (let d = 0; d < rings; d++) {
    const t = d / CONFIG.netSeg;
    const rad = lerp(hoop.r, hoop.r * 0.34, t);
    const y = hoop.y + t * CONFIG.netH;
    const row = [];
    for (let c = 0; c < CONFIG.netCols; c++) {
      const ang = (c / CONFIG.netCols) * TWO_PI;
      row.push({
        bx: hoop.x + cos(ang) * rad,
        by: y,
        x: hoop.x + cos(ang) * rad,
        y: y,
        vx: 0, vy: 0,
      });
    }
    net.push(row);
  }
}

function resetBall() {
  ball = {
    pos: createVector(CONFIG.ballStartX, height - CONFIG.ballStartYOffset),
    vel: createVector(0, 0),
    rot: 0,
    spin: 0,
  };
  trail = [];
  flightPath = [];
  state = STATE.READY;
  passedRimTop = false;
  scoredOnce = false;
  touched = false;
  shotStartX = ball.pos.x;
  confetti = [];
  celebrate = 0;
}

// =====================================================================
function draw() {
  drawBackground();
  drawScoreLines();
  drawHoop();

  if (state === STATE.FLY || state === STATE.WAITING) {
    stepPhysics(CONFIG.timeScale);
  } else if (state === STATE.REPLAY) {
    stepReplay();
  }

  updateTrail();
  drawTrail();

  if (dragging && state === STATE.READY) {
    drawDragUI();
  }

  drawBall();
  if (state === STATE.REPLAY) {
    drawReplayPath();
    drawGhost();
  }

  updateConfetti();
  drawConfetti();
  drawCelebrate();

  drawHUD();

  if (resultTimer > 0) {
    resultTimer--;
    drawResult();
  }

  syncScoreChip();
}

// =====================================================================
// 物理
// =====================================================================
function stepPhysics(dt) {
  const prev = ball.pos.copy();

  ball.vel.y += CONFIG.gravity * dt;
  ball.vel.mult(Math.pow(CONFIG.airDrag, dt));
  ball.pos.x += ball.vel.x * dt;
  ball.pos.y += ball.vel.y * dt;
  ball.rot += ball.spin * dt;

  trail.push({ x: ball.pos.x, y: ball.pos.y, age: 0 });
  if (trail.length > CONFIG.trailMaxLen) trail.shift();

  if (state === STATE.FLY) {
    flightPath.push({ x: ball.pos.x, y: ball.pos.y });
  }

  collideBackboard();
  collideRim();
  checkScore(prev, ball.pos);
  collideBounds();
}

function checkScore(prev, now) {
  if (state !== STATE.FLY) return;

  if (prev.y < hoop.y && now.y >= hoop.y) {
    const t = (hoop.y - prev.y) / max(0.0001, now.y - prev.y);
    const crossX = lerp(prev.x, now.x, t);
    const inside = Math.abs(crossX - hoop.x) < hoop.r - CONFIG.ballRadius * 0.35;
    if (inside && ball.vel.y > CONFIG.scoreVyMin) {
      if (!scoredOnce) {
        scoredOnce = true;
        attempts++;
        const dist = hoop.x - shotStartX;
        let base = 1;
        if (dist >= CONFIG.lineThree) base = 3;
        else if (dist >= CONFIG.lineTwo) base = 2;
        else if (dist >= CONFIG.lineOne) base = 1;

        const swish = !touched;
        const gained = swish ? base * 2 : base;
        score += gained;
        scoreFlash = 30;

        if (swish) {
          resultText = `空心球 +${gained}`;
          resultColor = PALETTE.swish;
          celebrate = 150;
          spawnConfetti();
        } else {
          resultText = `SCORE +${gained}`;
          resultColor = PALETTE.ok;
        }
        resultTimer = 70;
        kickNet(ball.vel.y * 0.6);
      }
    }
  }
}

function kickNet(strength) {
  if (!net) return;
  const rings = net.length, cols = net[0].length;
  for (let d = 1; d < rings; d++) {
    const f = (d / (rings - 1));
    for (let c = 0; c < cols; c++) {
      net[d][c].vy += strength * f;
      net[d][c].vx += (Math.random() - 0.5) * strength * f * 0.5;
    }
  }
}

function collideBackboard() {
  const bx = hoop.boardX;
  const top = hoop.y - CONFIG.backboardH * 0.72;
  const bot = hoop.y + CONFIG.backboardH * 0.28;
  if (ball.pos.y > top && ball.pos.y < bot) {
    if (ball.pos.x + CONFIG.ballRadius > bx && ball.vel.x > 0) {
      ball.pos.x = bx - CONFIG.ballRadius;
      ball.vel.x *= -CONFIG.restitution;
      ball.vel.y *= CONFIG.friction;
      ball.spin = ball.vel.x * 0.02;
    }
  }
  touched = true;
}

function collideRim() {
  const pts = [
    createVector(hoop.x - hoop.r, hoop.y),
    createVector(hoop.x + hoop.r, hoop.y),
  ];
  for (const p of pts) {
    const d = p5.Vector.sub(ball.pos, p);
    const minD = CONFIG.ballRadius + CONFIG.rimThickness * 0.5;
    if (d.magSq() < minD * minD && d.magSq() > 0.0001) {
      const n = d.copy().normalize();
      ball.pos = p5.Vector.add(p, n.copy().mult(minD));
      const vn = ball.vel.dot(n);
      if (vn < 0) {
        const normalPart = n.copy().mult(vn);
        const tangent = p5.Vector.sub(ball.vel, normalPart);
        ball.vel = p5.Vector.add(
          tangent.mult(CONFIG.friction),
          normalPart.mult(-CONFIG.restitution)
        );
        ball.spin = ball.vel.x * 0.02;
      }
    }
  }
  touched = true;
}

function collideBounds() {
  const r = CONFIG.ballRadius;
  if (ball.pos.y + r > groundY) {
    ball.pos.y = groundY - r;
    ball.vel.y *= -CONFIG.groundBounce;
    ball.vel.x *= CONFIG.groundFriction;
    if (Math.abs(ball.vel.y) < 1.2 && Math.abs(ball.vel.x) < 1.2) {
      if (!scoredOnce) {
        scoredOnce = true;
        attempts++;
        resultText = 'MISS';
        resultColor = PALETTE.miss;
        resultTimer = 70;
      }
      state = STATE.WAITING;
      return;
    }
  }
  if (ball.pos.x - r < 0) { ball.pos.x = r; ball.vel.x *= -CONFIG.restitution; }
  if (ball.pos.x + r > width) { ball.pos.x = width - r; ball.vel.x *= -CONFIG.restitution; }
}

// =====================================================================
// 回放
// =====================================================================
function startReplay() {
  if (flightPath.length < 2) return;
  replayIdx = 0;
  replayGhost = {
    pos: createVector(flightPath[0].x, flightPath[0].y),
    rot: 0,
  };
  state = STATE.REPLAY;
}

function stepReplay() {
  replayIdx++;
  if (replayIdx >= flightPath.length) {
    replayIdx = flightPath.length - 1;
    state = STATE.WAITING;
    return;
  }
  const p = flightPath[replayIdx];
  replayGhost.pos.set(p.x, p.y);
  replayGhost.rot += 0.15;
}

function drawReplayPath() {
  if (flightPath.length < 2) return;
  stroke(PALETTE.aim);
  strokeWeight(2);
  drawingContext.setLineDash([8, 8]);
  noFill();
  beginShape();
  for (const p of flightPath) vertex(p.x, p.y);
  endShape();
  drawingContext.setLineDash([]);

  const end = flightPath[flightPath.length - 1];
  noStroke();
  fill(PALETTE.aim);
  circle(end.x, end.y, 8);
}

function drawGhost() {
  push();
  translate(replayGhost.pos.x, replayGhost.pos.y);
  rotate(replayGhost.rot);
  noStroke();
  const c = color(PALETTE.ball);
  c.setAlpha(150);
  fill(c);
  circle(0, 0, CONFIG.ballRadius * 2);
  pop();
}

// =====================================================================
// 轨迹
// =====================================================================
function updateTrail() {
  for (let i = trail.length - 1; i >= 0; i--) {
    trail[i].age++;
    if (trail[i].age > CONFIG.trailLife) trail.splice(i, 1);
  }
}

function drawTrail() {
  if (trail.length < 2) return;
  noFill();
  const n = trail.length;
  for (let i = 1; i < n; i++) {
    const a = trail[i - 1], b = trail[i];
    const fadeOut = 1 - b.age / CONFIG.trailLife;
    const headIdx = n - 1 - i;
    const fadeIn = constrain(1 - headIdx / CONFIG.trailFadeIn, 0, 1);
    const along = i / n;
    const k = fadeOut * fadeOut * (0.35 + 0.65 * along);
    const w = CONFIG.trailWeightMax * k * lerp(0.35, 1, fadeIn);
    if (w < 0.05) continue;
    const c = color(PALETTE.trail);
    c.setAlpha(255 * k * 0.9);
    stroke(c);
    strokeWeight(w);
    line(a.x, a.y, b.x, b.y);
  }
  const h = trail[trail.length - 1];
  const hc = color(PALETTE.trail);
  hc.setAlpha(90);
  noStroke(); fill(hc);
  circle(h.x, h.y, CONFIG.trailWeightMax * 1.6);
}

// =====================================================================
// 交互
// =====================================================================
function computeLaunch() {
  let v = createVector(ball.pos.x - pointerX, ball.pos.y - pointerY);
  let d = v.mag();
  if (d > CONFIG.maxDragDist) { v.setMag(CONFIG.maxDragDist); d = CONFIG.maxDragDist; }
  return { vel: v.copy().mult(CONFIG.powerScale), dist: d, dir: v };
}

function handleDragStart(x, y) {
  if (state === STATE.WAITING || state === STATE.REPLAY) return;
  if (state !== STATE.READY) return;

  if (p5.Vector.dist(createVector(x, y), ball.pos) <= CONFIG.ballRadius + 8) {
    repositioning = true;
    ball.vel.set(0, 0);
    ball.spin = 0;
    trail = [];
    ball.pos.set(x, y);
    return;
  }

  dragging = true;
  dragStart = createVector(x, y);
  dragNow = dragStart.copy();
}

function handleDrag(x, y) {
  if (repositioning) {
    ball.pos.set(constrain(x, CONFIG.ballRadius, width - CONFIG.ballRadius),
                 constrain(y, CONFIG.ballRadius, groundY - CONFIG.ballRadius));
  } else if (dragging) {
    dragNow.set(x, y);
  }
}

function handleDragEnd(x, y) {
  if (repositioning) {
    repositioning = false;
    return;
  }
  if (!dragging) return;
  dragging = false;
  pointerX = x; pointerY = y;
  const L = computeLaunch();
  if (L.dist < CONFIG.minDragDist) return;
  ball.vel = L.vel;
  ball.spin = -L.vel.x * 0.02;
  trail = [];
  shotStartX = ball.pos.x;
  touched = false;
  state = STATE.FLY;
}

function handleTap(x, y) {
  // REPLAY 状态：点击任意处结束回放
  if (state === STATE.REPLAY) {
    state = STATE.WAITING;
    return;
  }
  // WAITING 状态：由 HTML 按钮处理（再投 / 回放）
}

function keyPressed() {
  if (key === 'r' || key === 'R') { resultTimer = 0; resetBall(); }
  if (key === ' ') { CONFIG.timeScale = CONFIG.timeScale === 1 ? 0.35 : 1; }
  if (key === 's' || key === 'S') saveCanvas('shot', 'png');
  if (key === 'p' || key === 'P') { if (state === STATE.WAITING) startReplay(); }
  if (key === 'c' || key === 'C') { celebrate = 150; spawnConfetti(); }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  computeLayout();
  if (state === STATE.READY) resetBall();
}

// =====================================================================
// 渲染
// =====================================================================
function drawBackground() {
  background(PALETTE.bg);

  // 波点纹理（呼应设计规范 §4，两层错位圆点）
  noStroke();
  fill(22, 22, 22, 22);
  for (let x = 0; x < width; x += 34) for (let y = 0; y < groundY; y += 34) circle(x, y, 1.4);
  fill(22, 22, 22, 12);
  for (let x = 17; x < width; x += 54) for (let y = 27; y < groundY; y += 54) circle(x, y, 1.4);

  // 场地色带 + 墨色地面线
  noStroke();
  fill(PALETTE.ground);
  rect(0, groundY, width, height - groundY);
  stroke(PALETTE.ink);
  strokeWeight(3);
  line(0, groundY, width, groundY);
}

function drawHoop() {
  const top = hoop.y - CONFIG.backboardH * 0.72;
  const bot = hoop.y + CONFIG.backboardH * 0.28;

  const poleTopY = top - 6;
  const braceAnchorY = lerp(poleTopY, groundY, 0.42);
  const armFrontX = hoop.boardX + 4;

  // 地面加宽底座（墨色）
  noStroke();
  fill(PALETTE.pole);
  const baseW = 70;
  rect(hoop.poleX - baseW / 2, groundY - 8, baseW, 10, 3);

  // 斜拉撑
  stroke('#4a4638');
  strokeWeight(5);
  line(hoop.poleX, braceAnchorY, armFrontX, poleTopY);

  // 竖直主立柱（墨色硬描边）
  stroke(PALETTE.pole);
  strokeWeight(9);
  line(hoop.poleX, groundY, hoop.poleX, poleTopY);

  // 顶部水平悬臂
  strokeWeight(7);
  line(hoop.poleX, poleTopY, armFrontX, poleTopY);

  // 悬臂到篮板背面的连接段
  strokeWeight(5);
  line(armFrontX, poleTopY, hoop.boardX, top + 6);
  line(armFrontX, poleTopY, hoop.boardX, bot - 6);

  // ---- 篮板（宝蓝 + 墨色外框） ----
  noStroke();
  fill(PALETTE.ink);
  rect(hoop.boardX - 7, top - 5, 12, (bot - top) + 10, 2);
  stroke(PALETTE.board);
  strokeWeight(5);
  line(hoop.boardX, top, hoop.boardX, bot);
  // 投篮参考框（墨色描边）
  stroke(PALETTE.ink);
  strokeWeight(2.5);
  const boxW = 46, boxH = 34;
  noFill();
  rect(hoop.boardX - boxW, hoop.y - boxH * 0.15, boxW, boxH, 2);

  // ---- 篮圈伸出臂 ----
  stroke(PALETTE.ink);
  strokeWeight(4);
  line(hoop.boardX, hoop.y, hoop.x + hoop.r, hoop.y);

  // ---- 篮圈（珊瑚红 + 墨色描边，透视压扁椭圆） ----
  push();
  stroke(PALETTE.ink);
  strokeWeight(CONFIG.rimThickness + 4);
  noFill();
  beginShape();
  for (let a = 0; a <= TWO_PI + 0.01; a += PI / 12) {
    const rx = cos(a) * hoop.r;
    const ry = sin(a) * hoop.r * 0.32;
    const sag = (sin(a) > 0) ? 3 : 0;
    vertex(hoop.x + rx, hoop.y + ry + sag);
  }
  endShape();
  stroke(PALETTE.rim);
  strokeWeight(CONFIG.rimThickness);
  beginShape();
  for (let a = 0; a <= TWO_PI + 0.01; a += PI / 12) {
    const rx = cos(a) * hoop.r;
    const ry = sin(a) * hoop.r * 0.32;
    const sag = (sin(a) > 0) ? 3 : 0;
    vertex(hoop.x + rx, hoop.y + ry + sag);
  }
  endShape();
  pop();

  // ---- 网兜 ----
  updateNet();
  drawNet();
}

function updateNet() {
  if (!net) return;
  const rings = net.length, cols = net[0].length;

  for (let d = 0; d < rings; d++) {
    for (let c = 0; c < cols; c++) {
      const p = net[d][c];
      if (d === 0) { p.x = p.bx; p.y = p.by; p.vx = 0; p.vy = 0; continue; }

      let ax = (p.bx - p.x) * CONFIG.netStiff;
      let ay = (p.by - p.y) * CONFIG.netStiff;

      const up = net[d - 1][c];
      ax += (up.x - p.x) * CONFIG.netStiff * 0.5;
      ay += (up.y - p.y) * CONFIG.netStiff * 0.5;

      const left = net[d][(c - 1 + cols) % cols];
      const right = net[d][(c + 1) % cols];
      ax += (left.x + right.x - 2 * p.x) * CONFIG.netStiff * 0.35;
      ay += (left.y + right.y - 2 * p.y) * CONFIG.netStiff * 0.35;

      const ph = frameCount * 0.05 + d * 0.7 + c * 0.9;
      ax += Math.sin(ph) * CONFIG.netSwing * (0.4 + d * 0.12);
      ay += Math.cos(ph * 1.3) * CONFIG.netSwing * (0.3 + d * 0.10);

      if (d === rings - 1) {
        ax += (Math.random() - 0.5) * CONFIG.netSwing * 1.4;
        ay += (Math.random() - 0.5) * CONFIG.netSwing * 0.6;
      }

      p.vx = (p.vx + ax) * CONFIG.netDamp;
      p.vy = (p.vy + ay) * CONFIG.netDamp;
      p.x += p.vx;
      p.y += p.vy;
    }
  }
}

function drawNet() {
  if (!net) return;
  const rings = net.length, cols = net[0].length;
  stroke(70, 67, 60, 150);
  strokeWeight(1.2);
  noFill();

  for (let c = 0; c < cols; c++) {
    beginShape();
    for (let d = 0; d < rings; d++) vertex(net[d][c].x, net[d][c].y);
    endShape();
  }
  for (let d = 0; d < rings; d++) {
    beginShape();
    for (let c = 0; c < cols; c++) vertex(net[d][c].x, net[d][c].y);
    vertex(net[d][0].x, net[d][0].y);
    endShape();
  }
}

function drawBall() {
  push();
  translate(ball.pos.x, ball.pos.y);

  if (state === STATE.READY) {
    const c = color(PALETTE.ball);
    c.setAlpha(60 + 40 * Math.sin(frameCount * 0.08));
    noStroke();
    fill(c);
    circle(0, 0, CONFIG.ballRadius * 2 + 14);
  }

  rotate(ball.rot);
  noStroke();
  fill(PALETTE.ball);
  circle(0, 0, CONFIG.ballRadius * 2);
  stroke(PALETTE.ballLine);
  strokeWeight(1.5);
  noFill();
  line(-CONFIG.ballRadius, 0, CONFIG.ballRadius, 0);
  arc(0, 0, CONFIG.ballRadius * 1.6, CONFIG.ballRadius * 2, -HALF_PI, HALF_PI);
  arc(0, 0, CONFIG.ballRadius * 1.6, CONFIG.ballRadius * 2, HALF_PI, PI + HALF_PI);
  pop();
}

function drawDragUI() {
  const L = computeLaunch();
  const power = constrain(L.dist / CONFIG.maxDragDist, 0, 1);

  // 拖拽连线
  stroke(PALETTE.ink);
  strokeWeight(1.5);
  stroke(22, 22, 22, 60);
  line(ball.pos.x, ball.pos.y, pointerX, pointerY);

  // 力度 / 角度指示
  const dir = L.dir.copy().normalize();
  stroke(lerpColor(color(PALETTE.ok), color(PALETTE.miss), power));
  strokeWeight(3);
  const len = 30 + power * 70;
  line(ball.pos.x, ball.pos.y, ball.pos.x + dir.x * len, ball.pos.y + dir.y * len);

  // 力度条（贴纸感）
  const bx = ball.pos.x - 40, by = ball.pos.y + 44;
  noStroke();
  fill(22, 22, 22, 40); rect(bx, by, 80, 6, 3);
  fill(lerpColor(color(PALETTE.ok), color(PALETTE.miss), power));
  rect(bx, by, 80 * power, 6, 3);

  const ang = degrees(Math.atan2(-dir.y, dir.x));
  fill(PALETTE.ink);
  textAlign(CENTER, TOP);
  textSize(12);
  textStyle(BOLD);
  text(`力度 ${nf(power * 100, 2, 0)}%   角度 ${nf(ang, 2, 0)}°`, ball.pos.x, by + 12);
  textStyle(NORMAL);
}

function drawHUD() {
  // READY 状态：显示当前球位置对应的分值预览
  if (state === STATE.READY) {
    const dist = hoop.x - ball.pos.x;
    let base = 1;
    if (dist >= CONFIG.lineThree) base = 3;
    else if (dist >= CONFIG.lineTwo) base = 2;
    else if (dist >= CONFIG.lineOne) base = 1;
    fill(PALETTE.ink);
    textAlign(LEFT, TOP);
    textSize(12);
    textStyle(BOLD);
    text(`此位置投中 = ${base} 分（空心再翻倍）`, ball.pos.x, ball.pos.y + CONFIG.ballRadius + 16);
    textStyle(NORMAL);
  }

  if (scoreFlash > 0) {
    scoreFlash--;
    noFill();
    const c = color(PALETTE.ok);
    c.setAlpha(map(scoreFlash, 0, 30, 0, 180));
    stroke(c);
    strokeWeight(3);
    circle(hoop.x, hoop.y + 20, map(scoreFlash, 30, 0, 20, 180));
  }
}

// 硬阴影文字（模仿 text-shadow）
function hardText(txt, x, y, size, mainCol, shadowCol) {
  textAlign(CENTER, CENTER);
  textSize(size);
  textStyle(BOLD);
  noStroke();
  fill(shadowCol || PALETTE.ink);
  text(txt, x + 4, y + 4);
  fill(mainCol || PALETTE.paper);
  text(txt, x, y);
  textStyle(NORMAL);
}

function drawResult() {
  const a = map(resultTimer, 0, 70, 0, 255);
  const c = color(resultColor);
  c.setAlpha(a);
  push();
  noStroke();
  fill(c);
  textAlign(CENTER, CENTER);
  textSize(46);
  textStyle(BOLD);
  text(resultText, width / 2, height * 0.22);
  pop();
}

// =====================================================================
// 地面分线（1/2/3 分区域标记，Memphis 配色）
// =====================================================================
function scoreLineX(threshold) {
  return constrain(hoop.x - threshold, 40, hoop.x - 20);
}

function drawScoreLines() {
  const lines = [
    { th: CONFIG.lineThree, label: '3 分', col: PALETTE.miss },
    { th: CONFIG.lineTwo,   label: '2 分', col: PALETTE.aim },
    { th: CONFIG.lineOne,   label: '1 分', col: PALETTE.ok },
  ];
  textAlign(CENTER, BOTTOM);
  for (const ln of lines) {
    const x = scoreLineX(ln.th);
    // 区域淡色带
    noStroke();
    const c = color(ln.col);
    c.setAlpha(20);
    fill(c);
    rect(x - 70, groundY - 4, 70, 4);
    // 竖直标记线（墨色描边 + 彩色）
    const lc = color(ln.col);
    lc.setAlpha(200);
    stroke(lc);
    strokeWeight(3);
    line(x, groundY - 4, x, groundY - 26);
    // 标签
    noStroke();
    fill(ln.col);
    textSize(11);
    textStyle(BOLD);
    text(ln.label, x, groundY - 28);
    textStyle(NORMAL);
  }
}

// =====================================================================
// 彩带庆祝（空心球）
// =====================================================================
function spawnConfetti() {
  confetti = [];
  const cols = ['#ff6b6b', '#ffd23f', '#2ec4b6', '#3a86ff', '#ff8fab'];
  for (let i = 0; i < CONFIG.confettiCount; i++) {
    const fromLeft = random() < 0.5;
    confetti.push({
      x: fromLeft ? -20 : width + 20,
      y: random(-40, height * 0.5),
      vx: (fromLeft ? 1 : -1) * random(3, 8),
      vy: random(-2, 2),
      w: random(6, 14),
      h: random(8, 18),
      rot: random(TWO_PI),
      vr: random(-0.3, 0.3),
      col: random(cols),
      life: CONFIG.confettiLife + floor(random(40)),
    });
  }
}

function updateConfetti() {
  if (celebrate <= 0 && confetti.length === 0) return;
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.vy += 0.18;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life--;
    if (p.life <= 0 || p.y > height + 30) confetti.splice(i, 1);
  }
  if (celebrate > 0) celebrate--;
}

function drawConfetti() {
  for (const p of confetti) {
    push();
    translate(p.x, p.y);
    rotate(p.rot);
    noStroke();
    const c = color(p.col);
    c.setAlpha(constrain(map(p.life, 0, 40, 0, 255), 0, 255));
    fill(c);
    rect(-p.w / 2, -p.h / 2, p.w, p.h, 2);
    pop();
  }
}

function drawCelebrate() {
  if (celebrate <= 0) return;
  const a = map(celebrate, 0, 150, 0, 80);
  noStroke();
  fill(255, 210, 63, a * 0.4);
  rect(0, 0, width, height);
  const ta = map(celebrate, 0, 150, 0, 255);
  const tc = color(PALETTE.swish);
  tc.setAlpha(ta);
  fill(tc);
  textAlign(CENTER, CENTER);
  textSize(30);
  textStyle(BOLD);
  text('完美空心球！', width / 2, height * 0.32);
  textStyle(NORMAL);
}

// =====================================================================
// HTML 联动：分数贴纸 + 按钮
// =====================================================================
let _lastScore = -1, _lastAttempts = -1;
function syncScoreChip() {
  if (score !== _lastScore || attempts !== _lastAttempts) {
    _lastScore = score; _lastAttempts = attempts;
    const el = document.getElementById('scoreval');
    if (el) el.textContent = `${score} / ${attempts}`;
  }
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('retryBtn').addEventListener('click', function () {
    resultTimer = 0;
    resetBall();
  });
  document.getElementById('replayBtn').addEventListener('click', function () {
    if (state === STATE.WAITING) startReplay();
  });
});

// =====================================================================
// 散落 Memphis 图形（点按换色）
// =====================================================================
(function () {
  'use strict';
  var COLS = ['#ff6b6b', '#2ec4b6', '#ffd23f', '#3a86ff', '#ff8fab'];
  var DEFS = [
    function (c) { return { w: 150, h: 60, html: '<svg viewBox="0 0 150 60"><path d="M6 40 Q 22 8, 40 34 T 76 32 T 112 30 T 146 26" fill="none" stroke="' + c + '" stroke-width="11" stroke-linecap="round"/></svg>' }; },
    function (c) { return { w: 90, h: 82, html: '<svg viewBox="0 0 90 82"><polygon points="45,4 88,78 2,78" fill="' + c + '"/></svg>' }; },
    function (c) { return { w: 96, h: 96, html: '<svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="' + c + '"/><circle cx="48" cy="48" r="24" fill="none" stroke="#f6f1e7" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round"/></svg>' }; },
    function (c) { return { w: 120, h: 62, html: '<svg viewBox="0 0 120 62"><path d="M2 60 A 58 58 0 0 1 118 60 Z" fill="' + c + '"/></svg>' }; },
    function (c) { return { w: 130, h: 56, html: '<svg viewBox="0 0 130 56"><rect x="4" y="4" width="122" height="48" rx="24" fill="' + c + '"/><g stroke="#f6f1e7" stroke-width="7" stroke-linecap="round"><path d="M42 12 L28 44"/><path d="M70 12 L56 44"/><path d="M98 12 L84 44"/></g></svg>' }; },
  ];
  // 图形集中在上/左边缘，避开球（左下）与篮架（右上）主操作区
  var SPOTS = [
    [4, 22, -6], [12, 40, 4], [24, 30, 8], [44, 20, -5],
    [70, 14, 6], [88, 22, -8], [58, 30, 4]
  ];
  var wrap = document.getElementById('decoWrap');

  function buildShapes() {
    Array.prototype.forEach.call(wrap.querySelectorAll('.sh'), function (e) { e.remove(); });
    var w = window.innerWidth;
    var s = w < 640 ? 0.5 : 0.68;
    var n = w < 520 ? 5 : SPOTS.length;
    SPOTS.slice(0, n).forEach(function (sp, i) {
      var di = i % DEFS.length, ci = i % 5;
      var d = DEFS[di](COLS[ci]);
      var el = document.createElement('div');
      el.className = 'sh';
      el.style.left = sp[0] + '%';
      el.style.top = sp[1] + '%';
      el.style.width = (d.w * s) + 'px';
      el.style.height = (d.h * s) + 'px';
      el.style.rotate = sp[2] + 'deg';
      el.dataset.rot = sp[2]; el.dataset.ci = ci; el.dataset.di = di;
      el.setAttribute('aria-hidden', 'true');
      el.innerHTML = d.html;
      el.addEventListener('click', function () {
        var c2 = (+el.dataset.ci + 1) % 5;
        el.dataset.ci = c2;
        var r = (+el.dataset.rot) + 22;
        el.dataset.rot = r;
        el.innerHTML = DEFS[+el.dataset.di](COLS[c2]).html;
        el.style.rotate = r + 'deg';
        el.style.transform = 'scale(1.15)';
        setTimeout(function () { el.style.transform = ''; }, 240);
      });
      wrap.appendChild(el);
    });
  }
  buildShapes();
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(buildShapes, 180);
  });

  document.getElementById('mq').textContent =
    'BASKET THROWER · 弹弓式投篮 · 越远分越高 · 空心翻倍 · '.repeat(24);
})();
</script>
